body:
  text: 金石例卷四元潘昻霄撰銘文之始事祖廣記云蔡雍曰黃帝有金几之銘王子年拾遺記曰黃帝以神金鑄器皆有銘題凡所造建皆記其年時此銘之起也三禮圖云檀弓曰銘明旌也以死者為不可别已故以其旗識之注明旌神明之旌也士喪禮云為銘各以其物亡則以緇長半幅赬末長終幅廣三寸書銘于末曰某氏某之柩注銘明旌也雜帛為物大夫之所建也以死者為不可别故其旗識識之愛之斯録之矣亡無也無旌不命之士也半幅一尺終幅二尺在棺為柩今文銘皆為名末為斾也竹杠長三尺置于宇西階上注杠銘橦也宇梠也周禮司常大喪則供銘旌注王則太常孤司常職云王建太常諸侯建旗卿建旜大夫士建物則銘旌亦然但尺數異耳士禮緯云天子之旌髙九仞諸侯七仞大夫五仞三仞其士喪禮竹杠長三尺則死者以尺易仞也天子九尺諸侯七尺大夫五尺士三尺其旌旗身亦以尺易仞也又從遣車之差蓋以喪事略故也若不命之士則士喪禮云以緇布半幅長一尺也赬其末長終幅長二尺也緇赬共長三尺廣三寸書銘於末曰某氏某之柩竹杠長三尺置于宇西階上荀禮論云祭祀敬事其神也其銘誄繫世敬傳其名也注銘謂書其功于器物若孔悝之鼎銘者誄謂誄其行狀以為諡也繫世謂書其傳襲若今之譜牒也皆所以敬傳其名于後世禮祭統銘之義稱美而不稱惡此孝子孝孫之心也銘者論著其先祖之有德善功烈勳勞慶賞聲名於天下前輩云銘婦人墓當詳于家世議論取法于韓退之退之所作蓋出于碩人之詩觀其銘元稹妻韋夫人墓可見矣銘式權德輿世德銘乃權公紀先世之德也四言無序此又一例也肅肅我祖𤣥鳥自天天乙革夏武丁相賢手文命子開國于權末云聿修之誡大懼不克夙夜以思敢銘世德唐故悼王石塔銘并序一唐開元五年嵗在丁巳四月庚午朔二十日庚寅故悼王薨于上陽之中禁曰二嵗而未及周嗚呼哀哉王即開元神武皇帝第九之愛子也以其月二十七日丙申葬于萬安山之東南嶺壙惟五尺棺不三寸壘石塔一丈于其上不雕不礱從尚薄也其銘曰南有萬安兮北有洛城城可望兮天之京嗚呼悼王寧不戀兮嗚呼悼王寧不見兮倚素塔兮凌翠微空不礙兮雲則飛嗚呼悼王兮其何歸蘇頲廬山女道士石碣銘道士梁洞微也玄其銘無序四言廬山德先生碣銘亦然符載河中府法曹張君墓碣銘君字直之祖歡父孝新皆為官汴宋間君嘗讀書為文辭有氣有吏才嘗感激欲自奮拔樹功名以見世初舉進士再不第因去事宣武軍節度使得官至監察御史坐事貶嶺南再遷至河中府法曹參軍攝虞鄉令有能名進攝河東令又有名遂署河東從事絳州闕刺史攝絳州事能聞朝廷元和四年秋有事適東方既還八月壬辰死于汴城西雙邱年四十有七明年二月日葬河南偃師妻彭城人世有衣冠祖好順泗州刺史父泳卒蘄州别駕女四人男一人嬰兒汴也是為銘韓退之虞部員外郎張府君銘尚書虞部員外郎安定張君諱季友字孝權年五十四病卒東都矣塗進韓氏門伏哭庭下曰叔父且死幾于不能言張目而言曰吾不可無告韓君别藏而不得韓君記猶不葬也塗為書致吾意巳而自署其末與封敢告以請愈既與為禮發書云云其末有復語千萬永訣八字名日月與封皆孝權迹孝權為人孝謹與人語恐傷之而時嶷嶷有立與孝權游者極衆而獨以其死纍余可尚也巳是為銘東明張先生銘匪祿而康匪爵而榮漠焉以虛充焉以盈言而不為華光而不為名介潔而周流苞涵而清寧幽觀其形與化為冥寂寞以成其道是以勿嬰世皆狂狂奔利死名我獨浩浩端一以生或曰先生友悌以道慈幼以死若不能忘情者何耶吾曰道去友耶去慈耶從容以求其得之耶蕩莽狠悻道之非耶且夫虧恩壞禮枯槁憔悴隳聖圖夀離中就異歘然與神鬼為偶頑然以朩石為類倥侗而不實窮老而無死先生之道固知異夫如此也乃書于石以紀桞子厚墓銘式李元賔墓銘已呼元賔夀也者吾不知其所慕夭也者吾不知其所惡生而不淑孰謂其夀死而不朽孰謂之夭已呼元賔才髙乎當世而行出乎古人已呼元賔竟何為哉竟何為哉韓退之崔評事墓銘朝之言嘻嘻夕之言怡怡偕入而出乘馬馳一日不見而死吁其悲施先生墓銘先生之祖氏自施父其後施常事孔子以彰讐為博士延為太尉太尉之孫始為吳人曰然曰續亦載其跡先生之興公車是召纂序前聞于光有曜古聖人言其㫖密微箋注紛羅顛倒是非聞先生講論如客得歸卑讓肫肫出言孔揚今其死矣誰嗣為宗縣曰萬年原曰神禾髙四尺者先生墓耶盧君墓銘盧君東美之愈謂立曰子來宜也行不可一二舉且吾生也後不與而祖接不得詳也其大者莫若衆所與觀所與衆寡兹可以審其德矣乃祖未出而處也天下大夫士以為與古之䕫臯者侔且可以為相其德不既大矣乎講說周公孔子樂其道不樂從事于俗得所從不擇外內奮而起其進退既不合于義乎銘如是可以示于今與後也歟立拜手曰唯唯君祖子輿濮州濮陽令父同舒州望江令夫人之祖延宗鄆州司馬父進成鄜州洛交令男三人暢申易女三人皆嫁為士人妻墓在河南緱氏縣梁國之原其年月日元和二年二月十日云大理評士胡君墓志胡之氏别於陳明允先河東人世勤固戴厥身籍文譜進連倫惟明允加武資力牛虎柔不持吏夏陽有施為去平陽民思悲河東土河陸原宜兹人肖厚完五十七不足年孤兒啼死下官母弟證秩大夫托君遺哭泣書友韓愈司馬徒作後銘系序初衛府君墓銘嗟惟君篤所信要無有弊精神以棄餘賈于人脫外纍自貴珍訊來世述墓文故相權公墓銘權在商周世無不存滅楚徙秦嬴劉之間甘泉始侯以及安邱詆訶浮屠皇極之扶貞孝之生鳯鳥不至爵位豈多半途以稅壽考豈多四十而逝惟其不有以惠厥後是生相君為朝德首行世祖之文世師之流連六官出入屏毗無黨無讐舉世莫疵人所憚為公勇為之其所競馳公絶不窺孰克知之德將在斯刻詩墓碑以永厥垂覃季子墓銘覃季子其人生愛書貧甚尤介特不苟受施讀經傳言其說數家推太史公班固書下到今橫竪鈎貫又且數十家通為書號覃子史纂又取鬻老管莊子思晏孟下到今其術自儒墨名法至于狗彘草朩凡有益于世者為子纂又百有若干家篤于聞不以仕為事黜陟使取其書以氏名聞除太子校書某年月日死永州祁陽縣某鄉將死嘆曰寧有聞而窮乎將無聞而豐乎寧介而躓乎將溷而遂乎葬其鄉後若干年桞先生來永州戚其文不大於世求其墓以石銘銘曰困其獨豐其辱桞子厚善人白公墓銘齒以德尊師以道存習俗以教遷惟仁人君子之所居若時雨然羽山之顔疵癘為蠲愧心發之彥方學業復于譙𤣥禮所以祠鄉長者而傳書先賢在昔兵屯河曲雄邊爰分公家乃誦乃絃身為義方奉之周旋兩息蹁蹁起為儒先岌彼熒臺火伏在泉振而鼓之有光屬天仲也銅章惠浹岐岍叔也奉璋入侍禁垣藹兮芝蘭之庭炯兮珠玉之淵州里趨風媚學躚躚至于餘波所及且孝弟而力田古有之種德欲深望嵗百年有相之道理無空捐祿匪我榮殆以為黨孰無窮之傳樂石有銘表公之阡異時配縣社之食尚有考焉元遺山墓志銘式裴君墓志銘裴為顯姓入唐尤盛支分族離各為大家惟公之系德隆位細曰子曰孫厥聲世繼晉陽之色愈愈翼翼無外無私幼壯若一何壽之不遐而祿之不多謂必有後其又信然耶韓退之薛君墓志銘宦不遂歸譏于時身不得年又將尤誰世再絶而紹祭以不隳韋夫人墓志銘詩歌碩人爰叙宗親女子之事有以榮身夫人之先纍公纍卿有赫外祖相我唐明歸逢其良夫夫婦婦獨不與年而卒以夭實生五子一女之存銘于好辭以永於聞李公墓志銘髙其上而坎其中以為公之宫奈何乎公房君墓志銘有位有年有弟有子從先人葬是謂受祉石公墓志銘生之艱成之又艱若有以為而止於斯韋公墓志銘武陽受業始于太師以官讓兄自待不疑勤于紫閣取益以卑可謂有源卒用無疵慊慊為人矯矯為官爰及江西功德具完名聲之下獨處為難辨而益明仇者所歎碑于墓前維昭美故納銘墓中以識公墓畢君墓志銘上古愛民為官求人茍可以任位加其身其後喜權人自求官退而緩者身後人先故廣平死節而子不荷其澤王屋謹廉而神不福其謙嗚呼天與人茍無傷其穴與墳盧丞墓志銘宏農諱懷仁沂諱璬襄陽諱某今年實元和六年苖君墓志銘有行以為本有文以為華恭以事其職而勤以嗣其家位卑而無年吁其奈何孔君墓志銘亢義孔君兹惟其藏更千萬年無敢壞傷杜君墓志銘杜氏大家世有顯人承繼綿綿以及公身始為進士乃篤朋友及作大官克施克守纂辭奮筆渙若不思公牒盈前笑語指麾祿以給求食以㑹同不畜不牧庫廄虛空事在於人日遠日亡何以傳之刻此銘章盧渾墓志銘前汝父母右汝兄汝從之居視汝如生遷汝居兮日月之良汝居孔固兮後無有殃如不信兮視此銘章息國夫人墓志銘男主外事治不為易施於其家難甚吏治又況公侯族大而貴夫人是專厥聲惟懿昔在貞元有錫自天啓封備服以疇時勳婉婉夫人有籍宫門克承其後以嫁以婚隨葬東土在河之陽遙望公墳而不同藏王君墓志銘鼎也不可以柱車馬也不可使守閭佩玉長裾不利走趨祗繫其逢不係巧愚不諧其須有銜不祛鑽石埋辭以列幽墟扶風郡夫人墓志銘隂幽坤從維德之恆出為辨強乃匪婦能淑哉夫人夙有多譽來嬪大家不介母父有事賔祭酒食祗飭協于尊章畏我侍側及嗣內事亦莫有施齊其躬心小大順之夫先其歸其室有邱合葬有銘壼彛是收李君墓志銘不贏其躬以尚其後人乳母墓志銘乳母李徐州人號正真入韓氏乳其兒愈愈生未再周月孤失怙恃李憐不忍棄去視保益謹遂老韓氏及見所乳兒愈舉進士第厯佐汴徐軍入朝為御史國子博士尚書都官員外郎河南令娶婦生二男五女時節慶賀輒率婦孫列拜進壽年六十四元和六年三月十八日疾卒卒三日葬河南縣北十五里愈率婦孫視窆封且刻其語于石納諸墓為銘盧太醫墓志銘岐黃聖學炳如日星茍非其人道不虛行惟尚藥公有得內經探病之源起死而生為醫作鏡底裏洞明道風既扇取重漢廷陽報㳫來壽考康寧翛然坐逝歸神太清大河安流扶衛厥靈扁鵲湯隂實魏大名遙遙華胄復起魏京古今世業前後家聲遺書具在永為世程元遺山張君墓志銘履潔修體柔嘉內美充福不遐哀哀蒼天孰使然耶天耶人耶其父母耶從容以思其得之耶茁其芽鬱其華其實孔多父播而子穫穰穰滿家故曰其源濫觴其流江河淵兮其未涯不有以浚之其末奈何然則古所謂不于其躬必于其子孫者尚信然耶尚信然耶墓碣式河中府法曹張君墓碣銘已見銘式蘧然子墓碣銘蘧然子諱滋字濟甫姓趙氏本出馮翊其大父天㑹貞元間來為汴梁戶籍判官卒官下妻子不能歸遂為汴人父諱青字漢卿蘧然子三男長某次某兵亂中所失小子尚幼二女次即孟卿所娶者蘧然子春秋五十有九以病終權葬于東平沂州門之外若干步庚子嵗除日豫實銘之其銘曰積之之深守之之堅傳人之所不傳兼人之所獨專自拔泥塗如蛻而仙文以表之慰彼下泉顧雖愛我豈以一言而敢私焉元遺山張遵古墓碣銘茫茫之原纍纍之阡行人而歸何千萬年有子而傳孰不欲揚其先今君獨然修德則人而死而不亡則天吾是以知其人之賢墓甎銘下殤女子墓甎銘孰致也而生孰召也而死焉從而來焉往而止魂氣無不之也骨肉歸復于此桞子厚小姪女墓甎銘字為雅氏為桞生甲申死巳丑日十二月在九是日葬東岡首生而惠命則夭始也無今何有質之微當速朽銘兹瓦期永久壙銘式女拿壙銘汝宗葬于是汝安歸之惟永寧韓退之金石例卷四
