body:
  text: 金石例卷六元潘昻霄撰韓文公銘志括例自宦業俊偉者叙起而以世系妻子居後朝散大夫贈司勳員外郎孔君墓志銘二十六卷自急流勇退者叙起次履厯家世而以死葬居後正議大夫尚書左丞孔公墓志銘二十三卷自事實叙起次履厯家世子女而以葬年月居後考功員外郎盧君墓銘二十四卷先叙姓字三代次履厯而以妻子居後崔評事墓銘三十四卷清邊郡王楊燕竒碑文二十四卷河南少尹裴君墓志銘二十四卷國子助教薛君墓志銘二十四卷江西觀察使韋公墓志銘二十五卷國子司業竇公墓志銘三十三卷太原府參軍苖君墓志銘三十五卷清河郡公房公墓志銘二十七卷銀青光祿大夫贈工部尚書太原王公神道碑二十七卷殿中侍御史李君墓志銘二十八卷朝散大夫商州刺史除名徙封州董府君墓志二十九卷祕書少監贈絳州刺史獨孤府君墓志銘二十九卷檢校尚書左僕射統軍劉君墓志銘二十九卷監察御史衛府君墓銘三十卷河南令張君墓志銘三十卷鳳翔隴州節度使李君墓志銘三十卷河南觀察使中大夫洪州刺史中丞贈常侍太原王公神道碑銘三十一卷司徒侍中中書令贈太尉許國韓公神道碑銘三十三卷先叙家世興元少尹房君墓志銘二十五卷集賢校理石君墓志銘二十五卷河南府王屋縣尉畢君墓志銘二十五卷中散大夫河南尹杜君墓志銘二十六卷銀青光祿大夫襄陽郡王平陽路公神道碑銘二十六卷故相權公墓銘三十卷桞子厚墓志銘三十二卷昭武校尉守左金吾衛將軍李公墓志銘三十二卷朝散大夫尚書庫部郎中鄭君墓志銘三十二卷朝散大夫越州刺史薛公墓志銘三十二卷中大夫陜府左司馬李君墓志銘三十四卷虢州司戶韓府君墓志銘三十五卷韓滂墓志銘三十五卷不書家世而書履厯李元賔墓銘二十四卷不書家世履厯而言丹砂之害大學博士李君墓志銘三十四卷先叙死年月起施先生墓銘二十四卷登封縣尉盧殷墓志銘二十五卷先叙死者葬地河東觀蔡鄭公神道碑文二十六卷先叙姓名履厯而以三代妻子居後試大理評事王君墓志銘二十八卷江南觀察贈常侍太原王公墓志銘三十三卷幽州節度判官贈給事中張君徹墓志銘三十四卷無履厯可叙者處士盧君墓志銘三十四卷韓滂墓志三十五卷考功員外郎盧君墓銘二十四卷僅有初筮可書者李元賔墓銘二十四卷登封縣尉盧殷墓志銘三十五卷河南王屋縣尉畢君墓志銘二十五卷虢州司戶韓府君墓志銘二十五卷叙文辭之盛者施先生墓銘二十四卷貞曜先生孟郊墓志二十九卷南陽樊紹述宗師墓志銘三十四卷自賜廟叙起烏氏廟碑銘二十六卷魏博節度觀察使沂國田公先廟碑銘二十六卷自乞銘叙起河南少尹李公墓志銘二十五卷袁氏先廟碑二十七卷貞曜先生孟郊墓志二十九卷庫部員外郎張府君墓志銘二十九卷中散大夫少府監胡良公墓神道碑三十卷有志無銘登封縣尉盧殷墓志銘二十五卷襄陽盧丞墓志銘三十五卷河中府法曹張君墓碣銘二十五卷殿中少監馬君墓志三十三卷貝州司法參軍李君墓志銘三十四卷太學博士李君墓志三十四卷述其妻子之辭朱子謂别是一體此文之變襄陽盧丞墓志二十五卷河中府法曹張君墓碣銘二十五卷虞部員外郎張府君墓志二十九卷殿中少監馬君墓志三十三卷貝州司法參軍李君墓志三十四卷法揚子雲造語洪氏云竒朱子謂用字古曹成王碑二十八卷王臨川以為銘之竒者試大理評事王君適墓志二十八卷故幽州節度判官贈給事中清河張君墓志三十四卷樓迂齊所取者殿中少監馬君墓志三十三卷唐故河中府法曹張君墓志二十五卷賜廟碑體烏氏廟碑銘二十六卷魏博節度觀察使沂國田公先廟碑銘二十六卷袁氏先廟碑二十七卷郡王碑體清邊郡王楊燕竒碑二十四卷曹成王碑二十八卷銀青光祿大夫襄陽郡王平陽路公碑二十六卷公相銘志體檢校尚書左僕射統軍劉公墓志銘二十九卷故相權公墓銘三十卷清河郡公房公墓碣銘二十九卷司徒兼侍中中書令贈太尉許國韓公神道碑銘三十二卷銀青光祿大夫贈工部尚書太原郡公王公神道碑二十七卷節度觀察刺史志銘碣河東節度觀察使滎陽鄭公神道碑二十六卷鳳翔隴州節度使李公墓志銘三十卷魏博節度觀察使沂國田公先廟碑銘二十六卷江南西道觀察使贈左散騎常侍太原王公神道碑三十一卷又志銘三十三卷朝散大夫商州刺史除名董府君墓志二十九卷祕書少監贈絳州刺史獨孤府君墓志銘二十九卷朝散大夫越州刺史薛公墓志銘三十二卷御史卿監郎官墓志博士附殿中侍御史李君墓志二十八卷監察御史衛府君墓銘三十卷正議大夫尚書左丞孔公戣墓志三十三卷國子司業竇公牟墓志三十三卷中散大夫少府監胡良公墓神道碑三十卷殿中少監馬君墓志三十三卷考功員外盧君墓銘三十四卷朝散大夫贈司勳員外郎孔君墓志二十六卷虞部員外郎張府君墓志二十九卷朝散大夫尚書庫部郎中鄭君墓志三十二卷太學博士李君干墓志三十四卷崔評事墓志二十四卷大理評事王君墓志二十八卷集賢院校理石君墓志三十五卷國子助教河東薛君墓志二十四卷州縣官志銘中散大夫陜府左司馬李公墓志三十四卷中散大夫河南尹杜君墓志二十六卷桞子厚墓志三十二卷河南少尹裴君墓志二十四卷河南少尹李公墓志三十五卷興元少尹房君墓志二十五卷幽州節度判官贈給事中清河張君徹墓志三十四卷太原府參軍苖君墓志二十五卷貝州司法參軍李君墓志三十四卷虢州司尸韓府君墓志三十五卷貞曜先生墓志二十九卷河南令張君墓志三十卷襄陽盧丞墓志二十五卷處士志銘處士盧君墓志三十四卷幼殤志銘盧渾墓志三十五卷韓滂墓志三十五卷金石例卷六
