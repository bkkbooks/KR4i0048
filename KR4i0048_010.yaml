body:
  text: 金石例卷十元潘昻霄撰史院纂修凡例凡二十七條聖旨詔制凡已經翰林院潤飾者並全書其有直言直語者只先作隨所見聞敘其事情條格末却書云是日詔諭中外元正朝賀如御正殿則書上御正殿受諸王百官朝賀或改日或免賀正日必書其故或在行則書上駐蹕某所扈從臣僚便賀于行宫外國來賀于賀下連書以次引見諸國使人如常儀若止是一國則曰某國遣其某官臣某來賀其有朝辭日分隨日月書車駕飛放書某日上畋于近郊至每日移駐蹕之地亦書及還宫則書上還宫車駕行幸某日車駕幸上都每日駐蹕隨事有可書者則書之至上都則書及還大都則書車駕還大都駐蹕亦隨事見至大都則書上還宫若事迹中不見則不書嶽瀆降香某日遣使持香祠五嶽四瀆后土如衡山始入版圖東海南海始遣使皆書至嶽瀆海加封則先書加五嶽四瀆四海封號某神加某號詳書之畢却書分遣使臣奉制辭香幣祠于廟所如西海北海附祭亦合書于初年後不復書或專遣一使遍行則特書聖節朝賀今書聖誕節某日受朝賀則同元日書諸王稱號親王除有封爵者書其爵諸王並稱親王其有昭穆可考者雖無封爵直書某昭穆小名皇屬除拜皇屬前有內職者書立某封某氏為皇后自外選內者書納皇后某氏太子書立某王為皇太子公主出嫁並稱下嫁內庭宴集為某王某國來朝設宴則書餘則否大會諸王緣故有所考則書神祗祭享本朝無郊社如灑馬乳之類事迹中可見則書社新立則書始建社稷于國西宗廟每嵗一享則書享于太廟攝獻官隨所見書如燒飯等亦隨所見書僧道祈禳隨事迹擇其大者書之百官拜罷左右丞相則書拜平章則云以某官平章政事左右丞則云以某人為某官參政則云以某官參知政事罷則書罷因功罪則各書其下貶降竄籍誅殺皆書百官除目三品以上則書其間有因事得官或特旨與官者不當以品數論當悉書之蒙古言語有合書者則云為國朝語誅殺罪人前代殺當其罪者書某人伏誅其不當者書殺某人其大辟則嵗終書是嵗斷死刑幾人或有奏讞出入者則附書其下錫賚犒勞當書緣故前代多是銀絹錢帛今多有細色緞子之類隨事實書又銀與鈔例合以兩及貫計不須計定數其餘賜當從其實甲子日分前史並書甲子不書日分近所草定兼日分姑欲易見耳今各精考甲子悉刪去日分天地災異京師所見則皆書偏方或見有成災者則皆書餘則否奏除臣僚內有奏而不允者必書其故無故者否奏對陳言臣下言事有關于大體者雖不準亦書升加散官初授散官各官合與備書其後隨職例升者不書或隨職降者則書不遷職止升散官者則書加某官征伐收撫如平定諸國初則書命某人率師伐某其後次第悉書至入國都則書某國平下併書已行事實或有反叛則書何地某人反命某人率師討之其後次第悉書至賊破敗畢則書賊平上親征者亦然外國君長外國不相屬時則書某國主某殂立則書某國主某立自朝廷立之者則書某國王某卒立某人為某國王未封王者書世子營造工作宮殿皆書寺觀亦書器物關朝廷用度者則書餘則否臣下奏事凡中書省官同奏則稱中書省官奏臺院亦同如一二人奏則直指其人或其他有司令省中奏則稱中書省轉奏某人言某事或左右近人奏亦直書某人奏某事其後得旨可之則稱從之有一日奏數事則類事于後稱並從之否則書不允有旨並載于下啓皇太子稱令旨準否則稱令旨不從臣僚薨卒宰相重臣書薨餘俱書卒金石例卷十
