body:
  text: 金石例巻七元潘昻霄撰韓文公銘誌括例宗族婣黨稱呼例書上代例其十一世祖殿中侍御史李君誌其上祖朝散大夫越州刺史薛公誌七世祖栁子厚誌六代祖國子司業竇公誌五世祖江西觀察韋公誌四世祖朝散大夫越州刺史薛公誌書曾祖例曾大父崔評事誌裴少尹誌劉統軍等誌曾祖少尹房公誌尚書左丞孔公誌大王父清河郡房公誌書曾伯叔祖例曾伯祖栁子厚誌書祖例大父崔評事誌裴少尹誌劉統軍等誌祖房少尹誌孔左丞誌王父清河郡公誌書父例父崔評事誌裴少尹誌劉統軍誌皇考正議大夫孔左丞誌烈考清邊郡王楊燕竒碑書母例父娶河南獨孤氏女生二子君其季也誌朝散大夫庫部鄭君公之父娶鄉邑劉氏女生公是為齊國大夫人司徒韓侍中碑父娶裴氏女貞曜先生誌父娶陳留太守薛江童女殿中侍御史李君誌母曰太原縣君虞部員外張府君誌母夫人燉煌張氏河南少尹李公誌公先妣渤海李氏贈渤海郡太君觀察太原王公誌書伯叔例世父伯父也四門博士周况妻韓氏誌註儀禮喪服篇有族曾祖父者曽祖之兄弟也其子為族祖父其孫為族父其曾孫為族兄弟有從祖祖父者祖父之兄弟也其子為從祖父其孫為從祖兄弟有世父叔父者父之兄弟也其子為從父兄弟今韓公于開封及虢州皆為從父弟矣于開封之女則公當為從祖父也叔父告于叔父公襄陽郡王路碑書伯叔母例世母伯母也書兄弟姊妹例母兄君母兄戣某官少孔員外誌常愽士河南尹杜君誌公之母兄太母兄戢某官除名人董府君誌歸宗之妹育㓜弟與歸宗之妹處士盧君誌族弟因其族弟以來請銘襄陽郡王路公碑書姊妹夫例姊壻銀青光禄王公誌妹壻愈于處士妹壻也盧處士誌書妻例妻彭城人河中府法曹張公誌公之配彭城劉氏夫人少尹李公誌夫人秘書少監獨孤府君誌公娶清河崔氏女故相權公誌公娶其舅女觀察太原王公誌書子男例能子是真能子矣襄陽盧丞誌爲後子仁本爲後子獨存觀察鄭公誌書女壻例長女壻次女壻觀察太原王公誌季女壻其季女壻韓愈爲之誌盧府君夫人苖氏誌書舅姑例姑氏母抱之置之姑氏以去誌中大夫陜府司馬李公尊章協于尊章扶風郡夫人誌書外家例外高王父外王父自外高王父至外王父銀青光禄大夫王公誌舅氏少依舅氏讀書習騎射司徒韓侍中誌夫人之兄生公是為齊國太夫人夫人之兄曰司徒同上舅弟葬子厚于萬年之墓者舅弟盧遵職名例有出身必書例大父含液舉進士第官卒河南法曹叅軍苖君誌父倚舉進士天寶之亂隱居而終崔評事誌皇考諱郇以儒學進官至侍御史河南令張君誌父宰臣用進士卒官平陽冀氏令贈潭州大都督中散大夫少府監胡公神道碑初干以進士爲鄂州從事太學博士李君干誌道古進士司門郎剌利隨唐睦徴爲少宗正兼御史中丞以節度督黔中朝京師改命觀察鄂岳蘄沔安黄曹成王碑公一兄三弟常羣庠鞏常進士水部員外郎朗䕫江撫四州刺史羣以處士徴自吏部郎中拜御史中丞出帥黔容以卒庠三佐大府自奉先令爲登州刺史鞏亦進士以御史佐淄青府皆有材名國子司業竇公誌有子曰寘明經及第嗣其家業江西觀察韋公誌有子男七人初哲貞宏泰復洄初進士及第哲文學俱善其餘㓜也觀察贈常侍太原王公誌内職必書例公曾祖諱𤣥靜尚書膳部郎中歴資簡涇隰四州刺史興元少尹房公誌大父某爲刑部侍郎出刺徐相州崔評事誌大父曠御史中丞京畿採訪使河南少尹裴君誌大父利貞有名𤣥宗世為御史中丞舉彈無所避由是出為陳留守領河南道採訪處置使河南令張君誌書除授例某年拜越州刺史注或作元和十二年正月二十二日方氏云前已云元和四年此不當復出年號他銘亦無書除授日月者刺史薛公誌家世例書三代例曾大父知道仕至大理司直大父𤣥同為刑部侍郎出刺徐相州父倚舉進士崔評事誌曾大父元簡大理正大父曠御史中丞京畿採訪使父虬以有氣畧敢諫諍為諫議大夫引正大疑有寵代宗朝屢辭官不肯拜卒贈工部尚書河南少尹裴君誌公曾祖諱𤣥靜尚書膳部郎中歴資簡涇隰四州刺史太尉之叔父也祖諱肱爲虢州司馬父諱巒都水使者皆名能守家法房少尹誌後七世至行褒官至易州刺史于君為曽祖易州生婺州金華令諱懐一卒葬洛陽北山金華生君之考諱平爲太子家令葬金華墓東而尚書水部郎劉復爲之銘集賢院校理石君誌其大王父融王父琯仍父子為宰相融相天后事遠不大傳琯相𤣥宗肅宗處艱難中與道進退薨贈太尉流聲於茲父乗仕至秘書少監贈太子詹事清河郡公房公誌曾大父諱承慶朔州刺史大父巨敖好讀老子莊周書為太原晉陽令再世宦北方樂其土俗遂著籍太原之陽曲曰自我為此邑人可也何必彭城父訟贈右散騎常侍劉統軍誌不書三代例登封縣尉盧殷誌並不書三代太學博士李君干誌並不書三代歴書世系例公諱郱字某雍王繪之後王孫道明唐初以屬封淮陽王又追王其祖父曰雍王長平王淮陽生景融景融親益疎不王生務該務該生思一思一生岌比四世官不過縣令州佐然益讀書為行為士大夫家岌為蜀州晉原尉生公未晬以卒陜府左司馬李公誌書三代及其兄例曾祖曰希莊撫州刺史贈大理鄉祖曰元暉果州流溪縣丞贈左散騎常侍父曰播尚書禮部侍郎侍郎命君後兄據據為尚書水部郎中贈給事中國子助教河東薛君誌書三代不名而及其女兄與甥以外戚故書莊憲皇太后之弟今天子之舅太師之子太尉之孫司徒之曾孫銀青光禄大夫太原王公神道碑不書曾祖而書六代祖及祖及父例六代祖敬遠嘗封西河公大父同昌司馬比四代仍襲爵名同昌諱𦙍生皇考諱叔向官至左拾遺溧水令贈工部尚書于大歴初名能為詩文國子司業竇公誌不書曾祖而書祖書父例祖曰旭袁州宜春尉父曰婼豪州定逺丞施先生誌祖子輿濮州濮陽令父同舒州望江令考功員外盧君誌大父知古祁州司倉烈考文誨天寶中實為平盧衙前兵馬使位至特進檢校太子賓客封宏農郡開國伯世掌諸蕃互市恩信著明夷人慕之清邊郡王楊燕竒碑祖某某官贈某官父某某官贈某官朝散大夫贈司勲員外郎孔君誌大父利貞有名𤣥宗世為御史中丞舉彈無所避由是出為陳留守領河南道採訪處置使數歲卒官皇考諱郇以儒學進官至侍御史河南令張君誌大父諱秀武后時以文材徴爲麟臺正字父宰臣用進士卒官平陽冀氏令贈潭州大都督中散大夫少府監胡良公神道碑不書曾祖祖而書六世祖及父例六世祖孝寛仕周有功以公開號于鄖鄖公之子孫世為大官惟公之父政卒雒縣丞贈虢州刺史江西觀察使韋公誌不書曾祖祖而書七世祖及曾伯祖及父例七世祖慶爲拓䟦魏侍中封濟陰公曾伯祖奭爲唐宰相與禇遂良韓瑗俱得罪武后死高宗朝皇考諱鎮以事母棄太常博士求為縣令江南其後以不能媚權貴失御史權貴人死乃復拜侍御史號為剛直所與游皆當世名人栁子厚誌不書曾祖祖而止書其父例公諱道古字某曹成王子其先王明以大宗子王曹絶輙復封五世而至成王成王諱臯有功建中貞元間以多才能能行賞誅為名至今追數當時内外文武大臣成王必在其間昭武校尉守左金吾衛將軍李公誌常州刺史贈禮部侍郎憲公諱及之第二子憲公躬孝踐行篤實而辨于文勸飭指誨以進後生名聲垂延紹德惟克秘書少監贈絳州刺史獨孤府君誌處士諱於陵其先范陽人父貽爲河南法曹叅軍處士盧君誌不特書父而書大王父王父伯例大王父𤣥暕歴御史屬三院止尚書郎生景肅守三郡終傅凉王生政襄鄧等州防禦使鄂州採訪使贈吏部尚書公尚書之弟某子江南西道觀察使太原王公神道碑書上世并書其母例其上祖懿爲晉安西將軍實始居河東公之四世祖嗣汾陰公諱德儒爲隋襄城郡書佐以卒襄城有子二人皆貴其後皆蕃以大而其季尤盛官至邠州刺史邠州諱寶𦙍有子九人皆有名位其最季諱縑為河南令以卒河南有子四人其長諱同卒官湖州長史贈刑部尚書尚書娶呉郡陸景融女有子五人皆有名蹟其達者四人公于倫次為中子朝散大夫越州刺史薛公誌書二母例初司徒公娶河南元氏封潁川郡夫人贈許國夫人許國薨少府始孩顧託以其姪為繼室是為陳國夫人陳國無子愛君與少府如已生其薨也君與少府喪之猶實生已親負土封其墓贈絳州刺史馬府君行狀書三代并書其母例曾祖匡時晉州霍邑令祖千尋彭州九隴丞父廸鄂州唐年令娶河南獨孤氏女生二子君其季也朝散大夫尚書庫部郎中鄭君誌其上世有暠者當宇文時爲車騎大將軍鄜城太守卒葬河北謚曰忠公至孝權間五世矣孝權大父諱孝先太子通事舎人父諱庭光贈綏州刺史綏州之卒孝權葢尚小母曰太原縣君卒既葬孝權守墓樹松栢三年而後歸虞部員外郎張府君誌書三代并書其母其舅例曾祖宏泰簡州刺史祖乾秀伊闕令父爕宣州長史贈絳州刺史母夫人燉煌張氏其舅參有大名河南少尹李公誌書父并其母舅不及上二代例公之父曰海為人魁偉沉塞以武勇游仕許汴之間寡言自可不與人交衆推以為鉅人長者官至游擊將軍贈太師娶鄉邑劉氏女生公是為齊國太夫人夫人之兄曰司徒𤣥佐有功建中貞元之間為宣武軍帥有汴宋亳潁四州之地兵士十萬人許國公韓宏神道碑書十一世祖及父及母例不及曽祖祖至書葬方見其十一世祖冲貴顯拓䟦世父惲河南温縣尉娶陳留太守薛江童女殿中侍御史李君誌書父及母及兄弟而不及上世例父庭玢娶裴氏女而選為崑山尉生先生及二季鄷郢而卒貞曜先生誌書婦女家世例書三代例夫人曾祖某綏州刺史祖某潞州别駕父某晉州録事叅軍息國夫人誌曾大父襲䕫贈禮部尚書大父殆庶贈太子太師父如蘭仕至太子司議郎汝州司馬河南府法曹盧府君夫人苖氏誌書祖書父及其舅其夫例夫人姓盧氏范陽人亳州城父丞序之孫吉州刺史徹之女嫁扶風馬氏為司徒侍中莊武公之冢婦少府監西平郡王贈工部尚書之夫人扶風郡夫人誌書父及其夫其子例楚國夫人姓翟氏故檢校御史大夫宋州刺史良佐之女今司徒兼中書令許國公之妻前鄜坊節度使散騎常侍兼御史大夫公武之母楚國夫人誌書兄弟例書兄及弟例公之昆弟五人載戡戢戵公于次為第二正議大夫尚書左丞孔公戣誌書妻例書妻及曾祖祖不書妻之父例公之配曰彭城劉氏夫人夫人先卒其葬以夫人祔夫人曾祖曰子𤣥祖曰餗皆有大名河南少尹李公誌書妻及妻之祖父不書妻曾祖例妻彭城人世有衣冠祖好順泗州刺史父泳卒蘄州别駕河中府法曹張君誌夫人天水權氏贈太子太保貞孝公臯之承孫故相今太常德輿之女𦙍慶配良是似是宜秘書少監贈絳州刺史獨孤府君誌書妻及妻之父不及其曾祖祖例夫人博陵崔氏少府監頲之女河南少尹裴君誌夫人常山郡君張氏彭州刺史贈禮部侍郎蔇之女生子男三人中散大夫河南尹杜君誌妻范陽盧氏鄭滑節度使兼御史大夫羣之女與君合德親戚無退一言殿中侍御史李君誌書妻及妻之父及曾伯父例夫人博陵崔氏朝邑令友之之女其曾伯父𤣥暐有功中宗時夫人高明遇子婦有節法進見侍側肅如也中大夫陜府左司馬李公誌書妻及妻叔祖不書其祖父例娶彭城劉氏女故相國晏之兄孫生男二人集賢院校理石君誌不書妻祖父例妻鄭氏也崔評事誌夫人河南胡氏號太原郡夫人工部尚書太原郡公神道碑君娶河東栁氏女河南令張君誌公娶其舅女有子七人觀察使贈常侍太原王公誌娶滎陽鄭氏女生男六人興原少尹房公誌妻曰太原王氏先先生卒施先生誌夫人李姓隴西人君在配君子無違德君殁訓子女得母道甚後君二十年年六十六而終考功員外盧君誌因葬書妻例其妻清河張氏以其年十二月丙寅葬君于洛陽平隂之原太原府叅軍苖君誌因祔葬書妻例夫人滎陽鄭氏祔銀青光禄大夫平陽路公碑奉先夫人天水趙氏祔中散大夫少府監胡公神道碑楚國夫人翟氏祔許國公韓宏神道碑書再娶例夫人隴西郡夫人李氏清夷郡太守祐之孫漁陽郡長史獻之女柔嘉淑明先公而殂有男四人女三人後夫人河南郡夫人雍氏某官之孫某官之女有男一人女二人咸有至性純行清邊郡王楊燕竒碑書三娶例公三娶元配韋氏諱修修生子紘紘為進士學女貢嫁崔氏夫人隋雍州牧鄖公叔裕五世孫父士佺蓬山令次配崔氏諱葯生綽紹綰女㑹嫁鄭氏季毘夫人父昭嘗為京兆尹今夫人韋氏無子父光憲光祿卿其葬用古今禮以元配韋氏夫人祔而葬次配崔氏夫人于其域異墓昭武校尉守左金吾衛將軍李公誌書婦德例𦙍慶配良是似是宜秘書少監贈絳州刺史獨孤府君誌賢有法度鳯翔隴州節度使李公誌孝順祗修羣女效其所為幽州節度判官贈給事中清河張君誌與君合德親戚無退一言殿中侍御史李君誌有賢行侍君疾逾年不下堂食菜飲水藥物必自擇將進輙先嘗方書本草恒置左右贈絳州刺史馬府君行狀書子女例書子女不名例有男八人女二人殿中少監馬君誌有子二人女二人崔評事誌有子六人女子一人銀青光祿大夫太原郡王公神道碑凡産四男五女男生輙即死國子助教河東薛君誌生男輙死卒無子女一人學浮屠法不嫁為比㐀尼云登封縣尉盧殷誌子書名女不書名例男三人長曰初協律次曰彪其幼曰還適三歲女子九人殿中侍御史李君誌男三人暢申易女三人皆嫁為士人妻考功員外盧君誌生男二人八歲曰壬四歲曰申女子二人集賢院校理石君誌子女並書名例有男十歲曰義女九歲曰孟處士盧君誌書子女及壻例生男六人其長曰次卿次卿有大才不能俯仰順時年四十餘尚守京兆興平尉然其友皆曰房氏有子也次曰次公次膺次回次衡次元始學而未仕女三人皆嫁為士人妻興元少尹房君誌書壻姓名例生三子一男二女男三歲夭死長女嫁亳州永城尉姚侹其季始十歲大理評事王君誌生六子四男二女長曰全正惠而早死次曰居中好學善為詩張籍稱之次曰從直曰居敬尚小長女嫁呉郡陸暢除名人董府君誌有四子長曰温質四門博士遵孺遵憲温裕皆明經女子長嫁中書舎人平陽路隋其季者㓜正議大夫尚書左丞孔公誌書子女及外孫例七男三女邠為澄城主簿其嫡激鄜城令放芮城尉漢監察御史滻洸潘皆進士及公之存内外孫十有五人中大夫陜府左司馬李公誌書異母子女例始娶范陽盧氏女生仁本仁約仁載皆有文行二季舉進士皆早死仁本為後子獨存後娶趙郡李氏生三女二夫人凡三男五女河東節度鄭公神道碑初娶吏部侍郎京兆韋肇女生二女一男長女嫁京兆韋詞次嫁蘭陵蕭儧後娶河南少尹趙郡李則女生一女二男其餘男二人女四人皆㓜嗣子退思韋氏生也朝散大夫尚書庫部郎中鄭君誌公有四子長曰元孫三原尉次曰元質彭之濛陽尉曰元立興平尉曰元本河南叅軍皆愿敏好善元立元本皆崔氏出鳳翔隴州節度使李公誌書子而無女例子曰友直明州鄮縣主簿曰友諒太廟齋郎施先生誌其子越能輯父事無失謹謹致孝清河郡公房公墓碣長子殿中丞繼祖孝友以類扶風郡夫人誌既葬其子監察御史璩纍然服喪來有請故相權公誌書子女年嵗例男三人璟質皆既冠其季始六歲曰充郎河南少尹裴君誌男子二人長曰某早死次曰天官始十歲有至性聞呼父官與聞弔客至輙號泣以絶女子一人秘書少監贈絳州刺史獨孤府君誌書女出家例女一人學浮屠法不嫁爲比丘尼云登封縣尉盧殷誌女子三人其長學浮屠法爲比丘尼其季二人未嫁河南府王屋縣尉畢君誌書子女生于死後例男三人執規執矩必復其季生君卒之三月太原府叅軍苖君誌子厚有子男二人長曰周六始四歲季曰周七子厚卒乃生女子二人皆㓜栁子厚誌書過房子例父曰播尚書禮部侍郎侍郎命君後兄據自給事至君後再絶皆有名遺言曰以公儀之子巳已後我國子助教河東薛君誌子男二人長曰肅元某官次曰公武某官肅元早死公之將薨公武暴病先卒公哀傷之月餘遂薨無子以公武子孫紹宗為主後許國公韓宏神道碑書子文學材質例戡强以肅成敏以和息國夫人誌好善學文能謹謹致孝述父之志曲而不黷國子司業竇公誌雖皆㓜侍疾居喪如成人贈絳州刺史馬君行狀書無子例唐元和九年歲在甲午八月已亥貞曜先生孟氏卒無子貞曜先生誌金石例巻七
