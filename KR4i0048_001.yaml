body:
  text: 金石例卷一元潘昻霄撰碑碣之始禮記檀弓下季康子之母死公肩假曰公室視豐碑注言視者時僣天子也豐碑斫大朩為之形如石碑於椁前後四角樹之穿中於閒為鹿盧下棺以繂繞天子六繂四碑前後各重鹿盧也三家視桓楹注時僣諸侯諸侯下天子也斫之形如大楹耳四植謂之桓諸侯四繂二碑碑如桓矣大夫二繂二碑士二繂無碑疏視比擬之辭也斫大朩為之形如石碑者禮廟庭有碑故蔡義云牲入麗于碑儀禮每云當碑揖此云豐碑故知斫大朩為碑也云於椁前後四角樹之者謂椁前後及兩旁樹之角落相望故云非正當椁四角也云穿中於閒為鹿盧者謂穿去碑中之朩令使空於空間著鹿盧兩頭各入碑朩云下棺以繂繞者繂即紼也人各背碑負紼末頭聼鼓聲以漸却行而下之案春秋天子有隧以羡道下棺所以用碑者凡天子之葬掘地以為方壙漢書謂之方中又方中之內先纍椁於其方中南畔為羡道以蜃車載柩至壙說而載以龍輴從羡道而入至方中乃屬紼於棺之緘從上而下棺入於椁之中於此時用碑繂也又云以言視桓楹不云碑知不似碑形故云如大楹耳通而言之亦謂之碑也云四植謂之桓者案說文桓亭郵表也謂亭郵之所而立表朩謂之桓即今之橋旁表柱也今諸侯二碑兩柱為一碑而施鹿盧故云四植謂之桓也周禮桓圭而為雙植者以一圭之上不應四柱但瑑為二柱象道旁二朩又宫室兩楹故雙植謂之桓也大夫亦二碑但柱形不得粗大所以異於諸侯也韻㑹舉要碑字注說文竪石紀功德從石卑聲徐曰按古宗廟立碑以繫牲耳後人因於其上紀功德此碑字從石秦以來制也七十二家封禪勒石不言碑七十二家封禪之言始于管仲不言碑穆天子傳乃為名迹于弇兹石上亦不言碑也銘勒功德當始于宗廟麗牲之碑也又祭義麗牲疏賈氏曰官必有碑士昏禮聘禮入門當碑揖則大夫士廟內皆有碑鄉飲酒鄉射三揖則庠序之內皆有碑據祭則諸侯廟內有碑碑所以識日景觀碑景邪正以知早晚宫廟用石為之葬碑取懸繩繂暫時往來運載當用朩而已喪大記注天子用大朩為碑謂之豐碑諸候樹兩大朩謂之桓楹檀弓注鄭氏曰斫大朩形如石碑於椁四角樹之穿中為鹿盧下棺以繂繞天子六繂四碑諸侯四繂二碑士二繂無碑又釋名云碑被也葬時所設臣子追述君父之功以書其上徐曰劉熙言起於懸棺之碑者蓋今神道碑也初學記碑悲也所以悲往事今人墓隧宫室之事通謂之碑矣事祖廣記云管子曰無懷氏封泰山刻石記功秦漢以來始謂刻石曰碑蓋因喪禮豐碑之制也刻石當以無懷為始而名碑自秦漢也陸龜䝉笠澤叢書曰碑悲也古者懸而窆用朩書之以表其功德因留之不忍去碑之名由是而得自秦漢以降生有功德政事者亦碑之而又易之以石失其稱矣此又德政有碑之起也陸法言廣韻曰碑碣李斯造宜始于嶧山之刻爾釋名曰本葬時所設臣子追述君父之功以書其上事祖廣記云古之葬有豐碑以窆秦漢以來死有功業生有德政者皆碑之稍改用石因總謂之碑晉宋之世始又有神道碑天子及諸侯皆有之其刻文止曰某帝或某官神道之碑今世尚有宋文帝神道碑墨本也其初由立之于葬兆之東南地理家言以東南為神道故以名碑爾案後漢中山簡王薨詔為之修冢塋開神道注云墓前開道建石柱以為標謂之神道是則神道之名在漢已有之也晉宋之後易以碑刻云墓志墓碑文辭各異如云千嵗之後陵谷變遷知其為良吏之壙其勿毁焉又云兩嬪鴈行同域也而不同藏之類止可施于墓內不可作碑用如文詞有可通用則或為墓志或為墓道之碑亦可也但碑上不言志字止曰某官某人墓碑或云墓碣墓志之始事祖廣記云炙轂子曰齊王儉云石志不出禮典石志一作朩志志按齊太子穆妃將葬議立石王儉曰石志不出禮經起宋元嘉中顔延之為王琳一作王彌作石志以其無銘誄故以紀行自爾遂相祖習然魏侍中繆襲改葬父母制墓下埋文將以陵谷遷變欲後人有所聞知但記姓名厯官祖父姻媾而已有德業則為銘文又隋代釀家於王戎墓得銘云晉司徒安豐元公王君之銘有數百字則魏晉已有其事不起於宋也馮鑑續事始云按西京雜記前漢杜子春一作杜子夏臨終作文命刻石埋于墓前恐墓志因此始也豫謂昔吳季札之喪孔子銘其墓曰嗚呼有吳延陵季子之墓莊子衛靈公葬沙邱掘得石椁銘曰不馮其子靈公奪而埋之唐開元時人有耕地得比干墓志刻其文以銅盤曰右林左泉後岡前道萬世之寧兹焉是保漢滕公夏侯嬰得定葬石銘曰佳城鬱鬱三千年見白日吁嗟滕公居此室則墓之有志其來逺矣碑碣制度諸碑碣其有皆須實録不得濫有褒飾五品以上立碑螭首龜趺二品以上上髙不得過一丈二尺五品以上上髙不得過九尺七品以上立碣圭首方趺上髙四尺其執政官以上聽立墳峯三品以上神道碑碑於墓隧道之左面南立螭首龜趺有依品從合得尺寸見儀制今更欲檢之此未盡也司馬公曰按令式墳碑石獸大小多寡各有品數然葬者當為無窮之規後世見此等物安知其中不多藏金玉耶是皆無益于亡者而反有害故令式又有貴得同賤賤不得同貴之文然則不若不用之為愈也五品以下不名碑謂之墓碣圭首方座以上石人石柱石羊石虎各有合得之數墓志制度墓志納之墓中柩前平放其狀如方石斗二底撮面平而不凹大小無定制上一斗於平面上大字題某官某人墓志銘曽見古墓中石志制度如此又記上一斗止寫某人墓志不書銘字下一斗上作小字書前一行刻云某官某人墓志銘并引或言有序或言并序後書序及銘刻畢以丹填之上下二斗字並用丹填二斗相合四角以薄石片搘起搘石如錢大厚薄亦如之但要不使二石實相壓著家禮云下志石云墓在平地則於壙內近南先布甎一重置石其上又以甎四圍之而覆其上若墓在山側峻處則於壙南數尺間掘地深四五尺依此法埋之墓表制度家禮云墳髙四尺立小石碑于其前亦髙四尺趺髙尺許按孔子防墓之封其崇四尺故取以為法用司馬公說别立小碑但石須濶尺以上其厚居三之二圭首而刻其面如志之蓋乃略述其世系名字行實而刻于其左轉及後右而周焉婦人則俟夫葬乃立面如夫亡志蓋之刻云墓表石立於墓前就地埋定上題云某人之墓無文辭墓雖無碑者亦當立此石石人羊虎柱制度事祖廣記云炙轂子曰秦漢以來帝王陵寢有石麟辟邪兕馬之屬人臣墓有石人羊虎柱之類皆表飾墳壠如生前儀衛風俗通曰方相氏葬日入壙驅罔象罔象好食死人肝腦人臣不能備方相乃立其象于墓側又罔象畏虎與柏故頂上栽柏路前立虎也盧思道西征記曰新城西有漢旌陽太守趙起墓有石柱東南有亭因名柱為表漢霍去病墓像祁連山立石人馬然則墓前之立石人柱羊虎之類皆起于漢也稀又唐王建北邙行云山頭澗底石漸盡向墳前作羊虎金制諸葬儀一品官石人四事石虎石羊石柱各二事二品三品减石人二事四品五品又减石柱二事墓圖古金石例云墓圖作方石碑先畫墓圖有作圓象者內畫墓樣各標其穴某人其石嵌之祭堂壁上無祭堂則嵌圍墻上韓魏公父墓圖今有此石嵗久臥之墻外宗氏圖碣二一埋中宫之下一立中宫之上太原以墳塋中心為宅神亦中宫之義也祭堂瓦花頭皆寫云某氏千秋墓甎亦然南陽宗資墓前人有得古花頭瓦其花頭刻云宗氏千秋今石刻在中州刺史宅凡祭堂二於中宫左右建家禮云刻志石用石二片其一為蓋刻云有宋某官某公之墓無官則書其字曰某君某甫其一為底刻云有宋某官某公諱某字某某州某縣人考諱某某官母氏某封某年月日生叙厯官遷次某年月日終某年月日葬于某鄉某里娶某處某氏某人之女子男某某官女適某官某人婦人夫在則蓋云有宋某官姓名某封某氏之墓無封則云妻無官則書夫之姓名夫亡則云某官某公某封某氏夫無官則云某君某甫妻某氏其底叙年若干適某氏因夫子致封號無則否葬之日以二石字面相向而以鐡束束之埋之壙前近地面三四尺間蓋慮異時陵谷變遷或誤為人所動而此石先見則人有知其姓名者庶能為掩之也諸墳塋地一品四面各三百步長周不等者以積步折之餘准此二品二百五十步三品二百步四品五品一百五十步六品以下一百步庶人不叙使官餘條葬無文者並准此及寺觀各三十步若經恩錫及山谷內巳業荒田者不在步數之限古今碑石同異漢碑有銘辭亦有無者今亦然謂神道碑并墓碣有銘辭者有無銘辭者今碑碣亦然也墓碑無銘辭刻墓前石柱上亦有刻在碑上者金石例卷一
