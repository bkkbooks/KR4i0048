body:
  text: 先文僖公所著金石例十巻制度文辭必稽諸古所以模範後學者也每見手澤不忍釋去與其私于一家孰若公于天下傳之子孫孰若法之人人使咸知先公之心去浮靡以還淳古顧不韙與謹刻之梓嘉與士大夫共之至正五年春三月望濟南潘詡敬書于巻末此書元刻于濟南文僖之子刋定重刻于鄱陽王思明校正三刻于龍宗武摹泰和楊寅弼抄本此從鄱陽本錄出故有思明叙
