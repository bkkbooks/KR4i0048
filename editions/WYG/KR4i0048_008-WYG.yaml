  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0048_WYG_008-1a, image: WYG1482/WYG1482-0338c.png}
body:
  text: 金石例巻八元潘昻霄撰書死例書死于官著年月日例貞元十八年十月十一日太學博士施先生士丐卒其僚太原郭伉買石誌其墓昌黎韓愈為之辭施先生誌疾病改河南少尹輿至官若干日卒實元和三年四月二十三日享年五十河南少尹裴君誌元和七年二月一日河南少尹李公卒年五十八河南少尹李公誌年六十一以元和六年二月二日卒于官河南府王屋縣尉畢君誌書死于官不書年月日例年若干而終在官舉其職考功員外盧君誌年七十三以其官終興元少尹房公誌以疾卒官年五十九清河郡公房公誌公在相位三年其後以吏部尚書授節鎮山南年六十以薨贈尚書左僕射謚文公故相權公誌書死于家著年月日例使者未復命以十五年正月五日寢疾終于家年五十有六矣崔評事誌十四年年六十一五月某日終于家清邊郡王楊燕竒碑文明年長慶四年正月已未公年七十四告薨于家贈兵部尚書正議大夫尚書左丞孔公誌書死于中道外州著年月日例元和四年秋有事適東方既還八月壬辰死于汴城西雙丘年四十有七河中府法曹張君墓碣元和五年正月將浴臨汝之湯泉壬子至其縣食遂卒年五十七朝散大夫孔君誌行及揚州遇疾居月餘以長慶元年八月二十四日卒春秋六十朝散大夫尚書庫部郎中鄭君誌書死于中道外州不書年月日例年二十九客死于京師李元賓誌張君諱季友字孝權年五十四病卒東都虞部員外郎張府君誌至南海未幾竟死年五十三監察御史衛府君誌書病死例元和四年年四十七二月十四日暴疾卒國子助教河東薛君誌年四十有二元和二年六月辛已暴病卒太原叅軍苖君誌疽發背六月乙酉卒年五十二殿中侍御史李君誌年七十四長慶二年二月丙寅以疾卒國子司業竇公誌命且下遂病以卒年若干南陽樊紹述誌校理集賢御書明年六月甲午疾卒年四十二集賢院校理石君誌在鎮三年以疾乞歸復拜司徒中書令病不能朝以長慶二年十二月三日薨于永崇里第年五十八天子為之罷朝三日贈太尉許國公韓宏神道碑年若干元和七年甲子日南至以疾卒息國夫人誌書不病而死例元和四年十一月二十二日無疾暴薨年六十中散大夫河南府尹杜君誌書死而不書死之地例春秋五十八薨于元和五年八月六日江西觀察韋公誌年三十七以卒殿中少監馬君誌子厚以元和十四年十一月八日卒年四十七栁子厚誌書死而不書死之歲月例年三十七以卒殿中少監馬君誌書生死年月日例生元和四年年三十七二月十四日疾暴卒國子助教河東薛君誌書死不書病例貞元十九年四月四日卒于東都敦化里年六十有九河南府法曹盧府君夫人苖氏誌書死為薨例元和五年尚書薨夫人哭泣成疾後二年亦薨年四十有六扶風郡夫人誌夫人以元和十四年十一月一日薨于鄜之公府春秋若干大夫委節去位奉喪以居東都詔起之辭以羸毁不仕即命又加喻勉楚國夫人翟氏誌書葬例書勅葬例在鎮三年以疾乞歸復拜司徒中書令病不能朝以長慶二年十二月三日薨于永崇里第年五十八天子為之罷朝三日贈太尉賜布粟其葬物有司官給之京兆尹監䕶許國公韓宏誌詔所在給船􅓅傳歸其家賜錢物以葬長慶四年四月某日其妻子以君之喪葬于某州某所幽州節度判官贈給事中張君誌書詔許還葬例長慶元年詔曰左降而死者還其官以葬遂以某年某月日葬于東都某縣昭武校尉守左金吾衛將軍李公誌明年立皇太子有赦令許歸葬其子居中始奉喪歸元和八年十一月甲寅葬于河南河南縣萬安山下太師墓左除名人董府君誌書自他州返葬例於歛之二十日其妻與其子以君之喪施葬于汝州其二月某日遂葬于某縣某鄉某原崔評事誌四月已酉其兄右拾遺朗以喪東葬河南壽安之甘泉鄉家塋憲公墓側將以五月壬申窆秘書少監贈絳州刺史獨孤府君誌明年兄子塗與其弟庾掞等䕶柩歸葬長安縣馬額原夫人北海唐氏之封虞部員外郎張府君誌元和十年十二月某日歸葬河南某縣某鄉某村祔先塋監察御史衛府君誌以十五年七月十日歸葬萬年先人墓側栁子厚誌書葬他州例初君樂虢之土田山水求掾其州去官猶家之既卒因以其年九月某日葬州北十里崔長史墓西虢州司户韓府君誌三日而歛既歛七日權葬宜春郭南一里嗚呼其可惜也已韓滂誌書葬祖父墓域例歛之三月某甲子葬河南伊闕鳴臯山下自簡州而下皆葬鳴臯山下河南少尹李公誌其年十月戊申葬河南洛陽縣距其祖澠池令府君僑墓十里殿中侍御史李君誌十月庚申樊子合凡贈賻而葬之洛陽東其先人墓左以餘財附其家而供祀貞曜先生誌即以其年十一月二十二日從葬于鄭州廣武原先人之墓次朝散大夫尚書庫部郎中鄭君羣誌其年八月某日葬河南偃師先公尚書之兆次國子司業竇公誌書夫祔妻墓例某月二十六日穿其妻墓而合葬之在其縣某地太學博士李君干誌其年閏三月二十一日弟試太子通事舎人公儀京兆府司錄公幹以君之喪歸以五月十五日葬于京兆府萬年縣少陵原合祔王夫人塋國子助教薛君誌書妻祔夫墓例嗣子通王屬良楨以其年十月庚寅葬公于開封縣魯陵岡隴西郡夫人李氏祔焉清邊郡王楊燕竒誌九年正月癸酉祔于其夫之封扶風郡夫人誌明年八月十四日葬京兆奉先夫人天水趙氏祔焉中散大夫少府監胡良公碑書合葬例年若干而終在官舉其職夫人姓李隴西人君在配君子無違德君殁訓子女得母道甚後君二十年年六十六而終君祖子輿濮州濮陽令父同舒州望江令夫人之祖延宗鄆州司馬父進成鄜州洛交令考功員外盧君誌貞元十七年九月丁夘隴西李翺合葬其皇祖考貝州司法叅軍楚金皇祖妣清河崔氏夫人于汴州開封縣某里昌黎韓愈紀其世著其德行以識其葬其世曰由凉武昭王六世至司空司空之後二世為刺史清淵侯由侯至于貝州凡五世其德行曰事其兄如事其父其行不敢有出焉其夫人事其姒如事其姑其于家不敢有專焉其葬曰翺既遷貝州君之喪于貝州殯于開封遂遷夫人之喪于楚州八月辛亥至于開封壙于丁巳墳于九月辛酉窆于丁卯貝州司法叅軍李君誌書各葬例其年八月甲申從葬河南河陰之廣武原卜人曰今兹歲未可以祔從卜人言不祔朝散大夫贈司勲員外郎孔君誌書因某人歸葬例既歛之三日友人博陵崔宏禮葬之于國東門之外七里鄉曰慶義原曰嵩原友人韓愈書石以誌之李元賓誌書本月内葬例卒三日葬河南縣北十五里愈率婦孫視窆封乳母誌以其月二十五日從葬偃師之土婁河南府王屋縣尉畢君誌書本年内葬例墓在河南緱氏縣梁國之原其年月日元和二年二月十日云考功員外盧君誌其年七月某日祔于法曹府君墓在洛陽龍門山河南府法曹叅軍盧府君夫人苖氏誌其妻清河張氏以其年十二月丙寅葬君于洛陽平陰之原太原府叅軍苖君誌書明年葬例明年葬京兆萬年少陵原銀青光禄大夫襄陽郡王平陽路公誌明年二月葬河南偃師河中府法曹張公誌明年二月甲午從葬懷州中散大夫河南尹杜君誌明年七月壬寅從葬萬年縣少陵原江西觀察韋公誌特書某年葬例長慶二年三月某日葬夫人于洛陽北山楚國夫人崔氏誌以四年二月某日葬于河南某縣先塋之側江西觀察常侍太原王公誌不書年月日例即葬于其地烏氏先廟碑不書葬地例樊紹述既卒且葬南陽樊紹述誌書某月幾日不書甲子例其二月某日遂葬于某縣某鄉某原崔評事誌以五月十五日葬于京兆府萬年縣少陵原國子助教薛君誌遂以其月十四日合葬河南緱氏之高龍原興元少尹房公誌書某月甲子即不書幾日例以其年十月庚寅葬公于開封縣魯陵岡清邊郡王楊燕竒碑卜葬得公卒之四月壬寅遂以其日葬東都芒山之陰杜翟村河南少尹裴君誌於其年九月乙酉其弟渾以家有無葬以車一乘於龍門山先人兆處士盧君誌其年十月戊申葬河南洛陽縣殿中侍御史李君誌金石例巻八
