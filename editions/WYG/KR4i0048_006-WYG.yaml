body:
  text: 金石例巻六元潘昻霄撰韓文公銘誌括例自宦業俊偉者叙起而以世系妻子居後朝散大夫贈司勲員外郎孔君墓誌銘二十六巻自急流勇退者叙起次履厯家世而以死𦵏居後正議大夫尚書左丞孔公墓誌銘二十三巻自事實叙起次履厯家世子女而以𦵏年月居後考功員外郎盧君墓銘二十四巻先叙姓字三代次履厯而以妻子居後崔評事墓銘三十四巻清邊郡王楊燕竒碑文二十四巻河南少尹裴君墓誌銘二十四巻國子助教薛君墓誌銘二十四巻江西觀察使韋公墓誌銘二十五巻國子司業竇公墓誌銘三十三卷太原府㕘軍苖君墓誌銘三十五巻清河郡公房公墓誌銘二十七巻銀青光禄大夫贈工部尚書太原王公神道碑二十七巻殿中侍御史李君墓誌銘二十八巻朝散大夫商州刺史除名徙封州董府君墓誌二十九巻秘書少監贈絳州刺史獨孤府君墓誌銘二十九巻檢校尚書左僕射綂軍劉君墓誌銘二十九巻監察御史衛府君墓銘三十巻河南令張君墓誌銘三十巻鳳翔隴州節度使李君墓誌銘三十卷河南觀察使中大夫洪州刺史中丞贈常侍太原王公神道碑銘三十一巻司徒侍中中書令贈太尉許國韓公神道碑銘三十三巻先叙家世興元少尹房君墓誌銘二十五巻集賢校理石君墓誌銘二十五巻河南府王屋縣尉畢君墓誌銘二十五巻中散大夫河南尹杜君墓誌銘二十六巻銀青光禄大夫襄陽郡王平陽路公神道碑銘二十六巻故相權公墓銘三十巻桞子厚墓誌銘三十二巻昭武校尉守左金吾衛将軍李公墓誌銘三十二巻朝散大夫尚書庫部郎中鄭君墓誌銘三十二巻朝散大夫越州刺史薛公墓誌銘三十二巻中大夫陜府左司馬李君墓誌銘三十四巻虢州司戸韓府君墓誌銘三十五巻韓滂墓誌銘三十五巻不書家世而書履厯李元賔墓銘二十四巻不書家世履厯而言丹砂之害大學博士李君墓誌銘三十四巻先叙死年月起施先生墓銘二十四巻登封縣尉盧殷墓誌銘二十五巻先叙死者𦵏地河東觀蔡鄭公神道碑文二十六巻先叙姓名履厯而以三代妻子居後試大理評事王君墓誌銘二十八巻江南觀察贈常侍太原王公墓誌銘三十三巻幽州節度判官贈給事中張君徹墓誌銘三十四巻無履厯可叙者處士盧君墓誌銘三十四巻韓滂墓誌三十五巻考功員外郎盧君墓銘二十四巻僅有初筮可書者李元賔墓銘二十四巻登封縣尉盧殷墓誌銘三十五巻河南王屋縣尉畢君墓誌銘二十五巻虢州司戸韓府君墓誌銘二十五巻叙文辭之盛者施先生墓銘二十四巻貞曜先生孟郊墓誌二十九巻南陽樊紹述宗師墓誌銘三十四巻自賜廟叙起烏氏廟碑銘二十六巻魏博節度觀察使沂國田公先廟碑銘二十六巻自乞銘叙起河南少尹李公墓誌銘二十五巻袁氏先廟碑二十七巻貞曜先生孟郊墓誌二十九巻庫部員外郎張府君墓誌銘二十九巻中散大夫少府監胡良公墓神道碑三十巻有誌無銘登封縣尉盧殷墓誌銘二十五巻襄陽盧丞墓誌銘三十五巻河中府法曹張君墓碣銘二十五巻殿中少監馬君墓誌三十三巻貝州司法叅軍李君墓誌銘三十四巻太學博士李君墓誌三十四巻述其妻子之辭朱子謂别是一體此文之變襄陽盧丞墓誌二十五巻河中府法曹張君墓碣銘二十五巻虞部員外郎張府君墓誌二十九巻殿中少監馬君墓誌三十三巻貝州司法叅軍李君墓誌三十四巻法揚子雲造語洪氏云竒朱子謂用字古曹成王碑二十八巻王臨川以為銘之竒者試大理評事王君適墓誌二十八巻故幽州節度判官贈給事中清河張君墓誌三十四巻樓迂齋所取者殿中少監馬君墓誌三十三巻唐故河中府法曹張君墓誌二十五巻賜廟碑體烏氏廟碑銘二十六巻魏博節度觀察使沂國田公先廟碑銘二十六巻袁氏先廟碑二十七巻郡王碑體清邊郡王楊燕竒碑二十四巻曹成王碑二十八巻銀青光禄大夫襄陽郡王平陽路公碑二十六巻公相銘誌體檢校尚書左僕射綂軍劉公墓誌銘二十九巻故相權公墓銘三十巻清河郡公房公墓碣銘二十九巻司徒兼侍中中書令贈太尉許國韓公神道碑銘三十二巻銀青光禄大夫贈工部尚書太原郡公王公神道碑二十七巻節度觀察刺史誌銘碣河東節度觀察使滎陽鄭公神道碑二十六巻鳳翔隴州節度使李公墓誌銘三十巻魏博節度觀察使沂國田公先廟碑銘二十六巻江南西道觀察使贈左散騎常侍太原王公神道碑三十一巻又誌銘三十三巻朝散大夫商州刺史除名董府君墓誌二十九巻秘書少監贈絳州刺史獨孤府君墓誌銘二十九巻朝散大夫越州刺史薛公墓誌銘三十二巻御史卿監郎官墓誌博士附殿中侍御史李君墓誌二十八巻監察御史衛府君墓銘三十巻正議大夫尚書左丞孔公戣墓誌三十三巻國子司業竇公牟墓誌三十三巻中散大夫少府監胡良公墓神道碑三十巻殿中少監馬君墓誌三十三巻考功員外盧君墓銘三十四巻朝散大夫贈司勲員外郎孔君墓誌二十六巻虞部員外郎張府君墓誌二十九巻朝散大夫尚書庫部郎中鄭君墓誌三十二巻太學博士李君干墓誌三十四巻崔評事墓誌二十四巻大理評事王君墓誌二十八巻集賢院校理石君墓誌三十五巻國子助教河東薛君墓誌二十四巻州縣官誌銘中散大夫陜府左司馬李公墓誌三十四巻中散大夫河南尹杜君墓誌二十六巻桞子厚墓誌三十二巻河南少尹裴君墓誌二十四巻河南少尹李公墓誌三十五巻興元少尹房君墓誌二十五巻幽州節度判官贈給事中清河張君徹墓誌三十四巻太原府叅軍苖君墓誌二十五巻貝州司法叅軍李君墓誌三十四巻虢州司尸韓府君墓誌三十五巻貞曜先生墓誌二十九巻河南令張君墓誌三十巻襄陽盧丞墓誌二十五巻處士誌銘處士盧君墓誌三十四巻幼殤誌銘盧渾墓誌三十五巻韓滂墓誌三十五巻金石例巻六
