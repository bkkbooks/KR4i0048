body:
  text: 金石例巻二元潘昻霄撰金石文之始周禮王功曰勲國功曰功民功曰庸事功曰勞治功曰力戰功曰多凡有功者銘書于王之太常禮記曰夫鼎有銘銘者自名也自名以稱揚其先祖之美而明著之後世者也為先祖者莫不有美焉莫不有惡焉銘之義稱美而不稱惡此孝子孝孫之心也唯賢者能之銘者論譔其先祖之有德善功烈勲勞慶賞聲名列於天下而酌之祭噐自成其名焉以祀其先祖者也顯揚先祖所以崇孝也身比焉順也明示後世教也夫銘者壹稱而上下皆得焉耳矣是故君子之觀於銘也既美其所稱又美其所為為之者明足以見之仁足以與之知足以利之可謂賢矣賢而勿伐可謂恭矣故衛孔悝之鼎銘曰六月丁亥公假于大廟公曰叔舅乃祖荘叔左右成公成公乃命荘叔隨難于漢陽即宫于宗周奔走無射啟右獻公獻公乃命成叔纂乃祖服乃考文叔興舊耆欲作率慶士躬恤衛國其勤公家夙夜不解民咸曰休哉公曰叔舅予女銘若纂乃考服悝拜稽首曰對揚以辟之勤大命施于烝彛鼎此衛孔悝之鼎銘也古之君子論譔其先祖之美而明著之後世者也以比其身以重其國家如此子孫之守宗廟社稷者其先祖無美而稱之是誣也有善而弗知不明也知而弗傳不仁也此三者君子之所恥也昔者周公旦有勲勞於天下周公既没成王康王追念周公之所以勲勞者而欲尊魯故賜之以重祭外祭則郊社是也内祭則大嘗禘是也夫大嘗禘升歌清廟下而管象朱干玉戚以舞大武八佾以舞大夏此天子之樂也康周公故以賜魯也子孫纂之至于今不廢所以明周公之德而又以重其國也春秋左氏傳曰季武子以所得於齊之兵作林鍾而銘魯功焉臧武仲謂季孫曰非禮也夫銘天子令德諸侯言時計功大夫稱伐今稱伐則下等也計功則借人也言時則妨民多矣何以為銘且夫大伐小取其所得以作彛器銘其功烈以示子孫昭明德而懲無禮也今将借人之力以救其死若之何銘之小國幸於大國而昭所獲焉以怒之亡之道也國語曰昔克潞之役秦來圖敗晉功魏顆以其身却退秦師於輔氏親止杜回其勲銘於景鐘克勝也魯宣十五年六月癸卯晉荀林父将㓕赤翟潞氏七月秦桓公伐晉次於輔氏晉景公治兵以畧翟土及潞魏顆敗秦師於輔氏獲杜回景鐘景公鐘碑式碑式之可法者固多舉其一二以為式後皆放此當類推之衢州徐偃王廟碑韓退之平淮西碑曹成王碑南海神廟碑處州孔子廟碑柳州羅池廟碑黄陵廟碑箕子碑桞子厚道州文宣王碑桞州文宣王碑終南山祠堂碑太白山祠堂碑湘源二妃廟碑饒娥碑南霽雲睢陽廟碑后土神祠碑張説唐天下放生池碑顔真卿禹穴碑鄭魴表忠觀碑蘓子瞻潮州韓文公廟碑伏波将軍廟碑壽域碑王元之四皓廟碑披雲堂碑馬子才東平行臺嚴公祠堂碑元遺山祭孤魂碑杜止軒文子廟碑郝伯常漢髙祖廟碑漢光武廟碑處士管寧廟碑碑陰文式碑陰文桞子厚碑陰記大明碑陰先友記處州孔子廟韓文公碑陰記杜牧之德政碑之始事祖廣記云自秦漢以來死有功業生有德政者皆記之稍改用石因總謂之碑德政碑式明州王密德政碑李舟易州刺史田仁琬德政碑蘓靈芝髙陵縣令劉君德政碑劉禹錫墓碑式清邉郡王楊燕竒碑文韓退之權公墓碑劉統軍碑王黄華墓碑元遺山寄菴先生墓碑費縣令郭明府墓碑宣武将軍孫君墓碑神道碑之始事祖廣記云晉宋之世始又有神道碑天子及諸侯皆有之其刻文止曰某帝或某官神道之碑今世尚有宋文帝神道碑墨本也其初猶立之於𦵏兆之東南地理家言以東南為神道若神靈出遊道之意故以名碑爾唐李夷簡臨終敕無碑神道神道碑式唐銀青光禄大夫守右散騎常侍致仕上柱國襄陽郡王平陽路公神道碑銘韓退之唐故河東節度觀察使滎陽鄭公神道碑文唐故中散大夫少府監胡良公墓神道碑唐故江南西道觀察使贈左散騎常侍太原王公神道碑司徒兼侍中中書令贈太尉許國公神道碑銘潮州長城縣令崔孚神道碑白樂天平章政事夀國張公神道碑元遺山沁州刺史李君神道碑内相文獻楊公神道碑轉運使王公神道碑朝散大夫胡公神道碑禮部尚書趙公神道碑内翰馮公神道碑國子祭酒馮公神道碑銘東平行臺嚴公神道碑朮虎公神道碑刺史馬公神道碑銘康公神道碑銘劉氏先塋神道碑完顔公神道碑畢侯神道碑銘千戸趙君神道碑家廟碑式立家廟自有品從唐人三品以上得立餘不得立碑與墓碑制度同曾見永寧縣西寺有文潞公家廟碑是司馬温公撰制度與墓碑同其隂今磨之刻寺記矣家廟碑立之家廟前司馬温公撰文潞公家廟碑其略云公以廟制未備不敢作主用晉荀安昌公祠制作神板采唐周元陽議祀以元日寒食春秋分冬夏至致齋一日又以或受詔之四方不常其居乃酌古諸侯載遷主之義作車奉神板以行此皆禮之從宜者也先廟碑式烏氏廟碑銘壬辰詔用鳥公為銀青光祿大夫河陽軍節度使兼御史大夫封張掖郡開國公居三年河陽稱治詔贈其父工部尚書且曰其以廟享即以其年營廟于京師崇化里軍佐竊議曰先公既位常伯而先夫人無加命號名差卑于配不宜語聞詔贈先夫人劉氏沛國太夫人八年八月廟成三室同宇祀自左領府君而下作主于第乙已升于廟魏博節度觀察使沂國公先廟碑銘田宏正始有廟京師謹案魏博節度使銀青光祿大夫檢校工部尚書兼魏州大都督府長史御史大夫沂國公田宏正北平盧龍人故為魏博諸将忠孝畏慎田季安卒其子幼弱用故事代父人吏不附迎宏正於其家使領軍事宏正籍其軍之衆與六州之人還之朝廷悉除河北故事比諸州故得用為帥已而復贈其父故滄州刺史兵部尚書母夫人鄭氏梁國太夫人得立廟祭三代曽祖都水使者府君祭初室祖安東司馬贈襄州刺史府君祭二室兵部府君祭東室袁氏先廟碑袁公滋既成廟明嵗二月自荆南以旂節朝京師留六日得壬子春分率宗親子屬用少牢于三室既事退言曰嗚呼逺哉維世傳德襲訓集余乃今有濟今祭既不薦金石音聲使工歌詩載烈象容其奚以飭稚昧于長乆惟敬繫羊豕幸有石如具著先人名跡因為詩繫之語下于義其可雖然余不敢必屬篤古而達于辭者遂以命愈巳上係韓退之丞相崔圓廟碑始立廟洛邑曰考廟王考廟皆二丈有七從四尋衡八尋二戸立楹外垂四阿圬塓彩繪施以丹雘齋室㸑室庭垣稱之禮曰以勞定國則祀之能禦大災則祀之能捍大患則祀之是宜廟食以銘于鼎古者諸侯立五廟有鼎與樂有國之制侯伯有爵而無土廟有鼎祭樂不克立五廟而立三廟不銘于鼎而銘于碑韓雲卿南康郡王韋臯先廟碑萬物本乎天人本乎祖乃立宗廟以交神明古者揚其功烈銘于祭器近古以魯鐘衛鼎追琢先德不若鏤文字于麗牲之碑之為詳也乃謹而書之權載之丞相代國公王涯先廟碑唐制五等有爵服而無山川登于三事得立四廟備物崇祀以交神明敬先報本以輔孝治有國之令典也唯長慶三年前相國王公始卜廟于西京崇業里公時鎮劍南東川上章曰臣涯官秩印綬品俱第三請如式以奉家廟制曰可是嵗仲冬申命長男孟堅祔其主于三室明年公入為御史大夫復以十一月親行烝嘗間嵗公出梁州就拜司空禮崇數異廟加祀室太和二年増新室既成祔顯考于尊位告饗由禮劉禹錫彭陽郡公令狐楚先廟碑今上元年七月具官令狐公西嚮拜章上言守臣楚䝉被㤙深列于元侯得立家廟以奉常祀制書下其奏于有司于是善相考祥得地于京師通濟里居無何新廟成公以守藩故申命季弟監察御史定卜牲練日越八月丁亥祔饗三室塪墉以尚幽設幄以迎精理無尤違神用寧謐劉禹錫右僕射趙郡李紳先廟碑王建侯侯建廟廟有器器有銘所以論譔先德明著後代或書于鼎或文于碑古今之通制也請齋沐祗慄拜章上言請立其廟以奉常祀于是得于天子承式于有司是嵗某月某日經始于東都明年某月某日有事于新廟外盡其物内盡其志三獻百順神格禮成白樂天先塋先德昭先等碑之始蒼崖先生曰先塋先德昭先等碑例似與神道碑墓誌碑不同先塋先德昭先等碑創業于國朝已前唐宋金皆無之所書三代并妻子例似與神道墓誌不同也先塋先德昭先等碑式安肅郝氏先塋之碑宣差五路萬戸郝侯和尚貞祐今年夏五月侯朝行闕對于幄殿者餘七十日且以上廐馬二西域馬三彤弓四鎧胄三金錦三并金虎符錫之夫人劉氏亦拜雙錦之賜幾按郝氏安肅人𦵏于縣之元鄉千秋里者不知昭穆矣曽大父諱廣資善良有隂德聞里中年八十三遇異人教之良禁齒髮更生又十年乃終妣曰劉氏大父諱全任俠尚氣勇于赴難有朱家郭解之器妣曰田氏生二子侯之父諱増氣節豪宕人多歸之不幸蚤世妣曰孫氏從上三世皆潜徳不耀獨叔父彦自承平時以貲為恩州酒務使次令安肅迄今康寧夀考生饗榮養嵗時問安孫息滿前郝宗陽報之慶斯濫觴也雖侯襲已積之善擁方來之福而生子如此祖考可以無恨矣元遺山大丞相劉氏先塋神道碑謹按劉氏世居宣德縣北鄉之青魚里孝弟力田蓋有年矣曽大父雲自遼日為大家有子四人曰璋曰瓊曰玹曰瓉玹之子四人顯仁字仲明祖仁字仲昌用仁字仲至體仁字仲康仲至府君即公之考也公家故大族府君娶同卿李氏生三子長敦字德厚季効字德信皆無禄早世公其第二子也自大父以來不常厥居有其先塋止于青魚西北原而已夫忠以報國孝以起家立身行道之義彰慎終追逺之德厚不有金石後裔何觀乃為之銘公名某字德柔以小字某行八子某其長已襲世爵云歸德府總管范陽張公先德碑范陽張公漢臣遣其叅佐陳玠李侃侯㺹自曹南走書幣及予于順天書謂予曰子良不敏爰自束髮以良家子𨽻軍籍轉戰南北将四十年馮藉先世積善之舊生還鄉國乃辛丑某月得用侯伯之服之禮展省墳墓考之令甲諸仕及通貴廟與墓俱有碑應用螭首龜趺之制竊不自揆度思得文士之見信于人者譔述之幾維張氏族出范陽其家于縣東仇家里者不知其昭穆矣自公曽大父甲而下皆隠德不耀大父臣甫資禀髙亮其夀八十有七怡然坐逝祖妣王氏李氏生子三人季諱珪純質有父風明昌壬子之夏三水泛濫漂壊廬舎至于㐀隴亦為湮没珪與長女李乘船筏百計訪求僅得祖考遺骸于泥淖之下其瀕于死者屢矣妣宋氏慈仁勤儉孝于舅姑生子二人長即公次曰子明仕為鄜州洛郊主簿母有前識謂公材幹特達後當貴顯常戒之毋妄殺以仁愛為懐墓故在三水之陽懲創水禍改卜其陰乃在所居之西南原見于辛丑新阡者特二世耳初大安兵興公以材選為軍中干夫長故予既論次其先德并以公出處附之欲人知張氏所以起其宗者蓋如此龍山趙氏新塋之碑嵗癸酉冬十月先太師以王爵綂諸道兵長驅而南吾癸卯冬十月侯介于同官李稚川周才卿為予言趙氏世居保塞以仕遷大梁五代末有諱匡頴者官至静江軍節度使兼桂州管内觀察使弟匡衡及八世孫襄叠仕于宋皆至通顯金朝兵破大梁吾家例為兵所驅盡室北行至龍山遂占籍焉雖譜牒散亡而其見于祖塋石誌者蓋如此振玉之曽大父坤隱田間致貲巨萬娶王氏生大父憲資倜儻好施予人多以急難歸之娶馬氏生子八人吾父琳其第四子也幼出大家頗以裘馬自喜由大父而上皆𦵏鄉里振玉之考妣兵亂中權厝縣西佛寺比避兵還而寺屋被焚遂失藁殯所在乃用故事卜于平棘縣西北鄉蘓村里之南原為顯考衣冠之藏日者室人冀氏物故因從祔焉維逺祖自保塞遷大梁既無嵗月可考自大梁遷龍山則僅能志之今南原卜宅亦吾趙宗之大舉不勒之金石以昭示永乆後世其謂我何誠得吾子辱以文賜之為幸多矣敢再拜以請下邳劉氏先德碑銘下邳劉氏其先世皆滄人自總管而上其世系名諱與其仕宦可知者凡四世髙祖父諱辛仕金官至顯武将軍軍資庫使符離縣尉升下邳令子二人長曰思誠次曰思謙業儒術有子二人曰元曰珍元早卒珍字子玉年八十二以壽終配樂氏潘氏子二人曰榮曰顯其一早卒皆樂氏所出榮字德茂至元十一年正月卒享年七十有六配邢氏子男二人長曰源承事郎樂安州判官娶徐氏子男二人曰某次即總管傑也娶謝氏前卒繼娶郭氏靈壽縣尹敏之女子男七人自傑字漢卿自曽大父以上皆𦵏下邳巨山之陽祖父以下皆𦵏益都今将補松楸之闕展拜掃之儀願得子之文刻之貞石乃為次第其世數事跡而繫之以銘王鹿庵彰德總管孫公先塋碑銘公之曽大父某娶何氏四子慶祐慶文慶元禄和慶元則公之大父也娶趙氏有婦德二子威平平早世威即公之考也年若干終于某官杜氏年八十八下及五世孫疾公率其子拱振等諸孫謙諧諠等以聞然而公未老事業尚未既而拱有才氣謙既能以世其業云予他日又可以考其淺深厚薄於此也劉夢吉懐孟萬戸劉公先塋碑銘按顯曽祖考諱徳安隠居不仕妣張氏楊氏顯祖考祁陽府君諱寳資幹竒偉氣畧過人鼎享年若干妣李氏楊氏姜氏顯考蒲陰府君諱世不避矢石竟被創而廢享年若干妣齊氏張氏三世皆𦵏祁州蒲陰之北鄉百長原其家宗支則有圖列碑陰龎氏墓道先德碑銘曽祖其次居十然以次推十曽外二伯曽則兄猶七人其下有季叔無耶昆弟耶從父從祖之昆弟耶所不可知姑計是十家子孫将不百人而止咸盡于賊惟十曽一子祖府君諱智者存考府君生六年當至元改明年巳丑夏五月二十有八日以卒年七十七考府君即墳䘮之仲應亦卒仲温以他求出異以九年戊辰十一月二十有七日卒年止四十七從𦵏先塋諸姑四人皆歸鄉人詠昆仲二人合仲父季父子各四人為十人輅銀符由同提舉興州採朩司主洺水簿卒子文抑文振詠子文括文播承顔合諸父之子男十二人女十一人姚牧菴鄒平賈氏昭先之碑賈氏世為濟南鄒平人祖諱某以敦斂自尚二子長諱某次諱某尚書君父也卒年六十四配王氏癸巳三月二十日年七十卒二子曰馴致道君曰某以字顯監濵州税孝友有為四女長適王氏次李氏次叚氏次王氏皆濟南盛族劉中菴賜碑名號之始退朝録云唐太宗自撰魏元成碑德宗亦撰叚秀實碑本朝太宗撰中令趙公碑皇祐中王侍郎子融守河中還乃以唐明皇所題裴耀卿額上之仁宗遂御篆賜沂公碑曰旌賢賜碑名號式旌賢王沂公碑懐忠吕許公碑顯忠李忠武公碑旌忠冦萊公碑全德元老王太尉碑教忠積慶文潞公父洎碑親賢李侍郎用和碑褒親齊國獻穆公主碑旌功曹襄悼碑崇儒丁文簡碑舊覺晏元獻碑舊德張鄧公碑顯先積慶趙中令子鼎昭碑旌忠懐德張侍中耆碑儒賢髙文莊碑思賢李相沆碑褒賢范文正公碑旌忠元勲狄忠襄碑褒忠陳恭公碑清忠王武恭碑純孝張文孝碑忠規德範宋元憲碑淳德守正吕文穆碑大儒元老賈公碑金石例巻二
