body:
  text: 金石例卷五元潘昻霄撰古墓表式蔡致遠墓表周景和墓表周無晦墓表李德元墓表楊希節墓表智氏夫人墓表司馬夫人墓表宋夫人墓表吕氏夫人墓表唐元夫墓表今墓表式文通先生陸給事墓表郡人陸先生質以其師友天水啖助洎趙匡能知聖人之旨故春秋之言及是而光明使庸人小童皆可積學以入聖人之道傳聖人之教是其德豈不侈大矣哉先生字某既讀書得制作之本而獲其師友於是合古今散同異聨之以言纍之以文蓋講道者二十年書而志之者又十餘年其事大備為春秋集注十篇辨疑七篇微旨二篇用是為天子爭臣尚書郎國子博士給事中皇太子侍讀皆得其道刺二州守人知仁永貞年侍東宫言其所學為古君臣圖以獻而道達乎上是嵗嗣天子踐祚而理尊優師儒先生以疾聞臨問加禮某月日終于京師某月日葬于某郡某里諡將葬以先生為能文聖人之書通于後世遂相與曰文通先生後若干祀有學其書者過其墓哀其道之所由乃作石以表碣桞子厚殿中侍御史桞公墓表唐貞元十二年二月庚寅葬我殿中侍御史河東桞公于萬年縣之少陵原公諱某字某邑居于虞鄉曽王父某官王父某官皇考某官奕世餘慶叢而未稔濟德流祉其後宜大秀而不實為善者惑嗚呼哀哉故友諸生宗人外姻號慟會葬哀禮咸申克窆玄堂掩坎廣輪顧盻無依徘徊增哀願勒休聲延垂後賢於是汝南周公巢等相與琢石書德用圖不朽文曰抱元淳稟粹和既強毅又柔嘉登儀曹耀文章司學徒儒風揚自渭北佐朔方戎政間黔首康冠惠文垂衣裳才不施天茫茫刋樂石篆遺德延休烈垂憲則于萬年長無極朝列大夫張公墓表公諱公著字庭俊姓張氏初名寧以夢兆改焉世為太原陽曲人曽大父某知宋將亂隱居不仕大父祐好讀書尤長于術數卜葬東山之大石谷自言却後三十年吾宗當有文達者已而果然考諱某資稟寬緩輕財好施以詩書棋酒自適後因公貴封朝列大夫生三子公其季也天先大夫履正奉公惟義所在死生禍福無所顧藉子大夫士飽聞而厭道之果得挂名表志自託不腐鄉里晚生預有榮焉敢不唯命是聼乃退而論次之而系之以銘銘曰平易而仁卓魯之近民發姦擊強趙張三王之所以神此在公為一節固已無望于時之人若夫確固而不移質直而無文直前徑行唯義所存有言責則致其忠有官守則致其身名節凛然獨為不二心之臣聞公之風益知鄙夫之不可以事君元遺山御史張君墓表謹按中奉大夫故治書侍御史守申州刺史張君諱汝明字子玉世家汶上曽大父靖大父彥皆潛德弗耀父恕用君貴贈中議大夫母程氏清河郡太君君三嵗喪父母程故衣冠家而有賢行力課君學君亦能自樹立如成人弱冠擢大安元年經義進士第及君資稟厚重與人交敦仁義平居恂恂似不能言當官而行剛介有守論議純正人不能奪仕宦三十年家無餘資其他尚多可稱弗著著不為窮達易節者銘曰汶之洋洋思聖有堂禮樂衣冠此為之鄉維御史君尤魯士之良沉潛而剛耆艾而敦龎可以為公卿大臣訓于四方昔往矣秉筆帝傍藹然粹溫如圭如璋今來斯微服褁糧衡門棲遲詠歌虞唐謂其逢也耶茫乎及夜舟之藏其不逢也耶泰焉如晚節之昌抱明月而長終懷舊俗而不忘在君為欒天而識者涕滂林深而蘭芳風雨如晦而雞鳴有常世無良史久矣孰為發幽潛之光司農丞康君墓表君諱錫字伯祿姓康氏世為寧晉人原中崇慶二年進士第釋褐櫟陽簿警巡判官辟彭令入為尚書省掾考滿遷開封府判官尋拜監察御史言宰相侯摰師安石非相材提點近侍局宗室安石聲勢焰焰公門請托不可使久在禁近朝議偉之選授右司都事遷京南路大司農丞破上蔡諸縣羣不逞把持之黨彈種人以贓汚尤狼籍者五六輩宰相有不説者云康錫不欲吾種人在仕路耶因以飛語中之出為河中府治中充行尚書六部郎中城陷投水死時年四十八陽曲令周君墓表君諱鼎字器之姓周氏世為定襄人遷陽曲令權河東北路轉運司户籍判官帥府檢察又明年雁門破兵勢駸駸而南鄉曲以太原不可保趣君弟獻臣就謀去就君為獻臣言城不保必矣我臣子也尚欲逃死乎獻臣欲挈君妻子以出君又不可曰吾守官于此而不以妻子自隨是懷二也吾弟往吾死于此矣乃與之泣别于北門之外是嵗城陷沒于兵實興定二年九月六日也得夀三十有七官奉直大夫史邦直墓表邦直諱元姓史氏世為武陟人某年遷河南乃占籍焉州遷管勾黃河漕運未幾河南破右丞仲德行臺徐檄邦直守禦注授彭城令尋轉充觀察判官危急存亡之際多所建白仲德甚倚重之喪亂後間關東歸嵗戊戌十二月二十有六日春秋五十有七以疾終于州之私第邦直為人軀幹雄偉望之如羽人劍客而處事詳雅倉猝無失辭事母孝待故舊有終始身殁之日識者多嗟惜之御史孫公墓表正大中內帑被盜所失皆慈聖宫珠貝上怒甚公時為監察御史被詔按其事而無迹可尋法官讞疑欲棄守者市公執奏緩之會赦得原汴民李氏女有姿色巳許嫁矣首相布薩之姪恃勢奪婚且欲以為妾夫家訴于官官畏徇不為理遂訴于公公為奏廟聞詔還巳許人八年親享太廟郕國夫人溫敦氏過門而不偃蓋公劾奏以為失臣妾禮上不忍加姨母罪敕有司杖御者百仍罰俸以愧之舊制承天門非犒軍不登一日上無故登焉公奏人主不可示民不信上即日為公犒軍庚寅辛卯以來雖軍出屢勝而亡徴已具危急存亡之際大夫士以自保為幸或髙蹈逺引脫屣世務或酣歌縱酒茍延嵗月公獨正色立朝耿耿自信言事數十條藹然有承平之風康公諱德秀字伯華其先涇州長武人大父臯遭靖之亂流寓太原之文水因家焉曹徴君墓表嵗丙午秋九月日曹徴君子玉以疾終于襄隂之寓舍春秋七十有四嗚呼哀哉世豈復有敦龎耆艾之士如君者乎君諱珏姓曹氏子玉其字也君既老自號囂囂老人有卷瀾集三卷藏於家銘曰仁信而篤誠寬博而和平以儒行概之衆善具并何負于人而不能百齡豈無百齡孰愈君之名城郭千年貞石有銘曰是維子曹子之墓尚可以為鄉人之榮也善人白公墓表公諱某字全道姓白氏經公資稟聰悟而謹厚自恃略通史精究厯算中年耽嗜佛書皆所成誦為人敦信義樂施與一言所諾千金不易家人化之皆以賢行稱焉正大中纍贈中大夫輕車都尉南陽郡伯兩夫人南陽郡太君維火山自太平興國中升為軍雖有學校而肄業者無幾宣和末僅有上舍宋生厯大定明昌官學之盛然後公之二子擢巍科取美仕邦人築亭以榮鄉名之屏山李君之純為作記辭與事稱相為不朽故公雖躬不受祀所以起其家與善化一鄉者其利豈有既耶南峯先生墓表先生諱豫字彥先姓吕氏懷州修武人祖道父琰皆力田為業先生自成童知讀書既冠遊學東州以易為專門經明行修髙出倫輩醇德先生王廣道特器重焉一時名士如秀容折安上濟陽王善長安陽苖景藩館陶段彥昌冠氏孫希賢田子發從之學者甚衆故家近太行五峯山因以為號示不忘本也有易説若干卷施州房使君鄭夫人殯表夫人之先出於周以鄭為氏因初侯曽祖諱隨祖諱玠厥考諱絳咸垂休歸于房宗生九子左右黍稷祠春秋道順德嚴顯且裕宜壽而富今何謬永貞冬至前四日寓殯墳此非其邱韓退之故𢎞農令桞府君墳前石表少陵原桞氏之大墓唐貞元十九年某月日孤某奉其先府君伯夫人之喪祔于其位由新墓而南若干步曰髙祖王父蘭州府君諱某字某之墓又東若干步曰曽祖王父邠州府君諱某之墓西若干步曰祖某王父司議郎府君諱某之墓咸異兆而相望昭穆之有位序壤樹之有豐殺皆如律令府君諱某字某由父任為太廟齋郎更許昌陽武伊闕華原尉王屋丞汝隂令為宏農二年推其誠心裕于其人之年五十五建中二年某月日卒于官以其素廉家蓄不足以充凶事遂殯于是邑桞子厚先侍御史府君神道表嗚呼先君之墓仲父殿中君志焉孤宗元不敢稱道先德然而無以昭于外者用敢悉取仲父之所陳而繁其辭刻兹石表先君諱鎮字某六代祖諱慶後魏侍中平齊公五代祖諱旦周中書侍郎濟隂公髙祖諱楷隋刺齊房蘭廓四州曽伯祖諱奭字子燕唐中書令曽祖諱子夏徐州長史祖諱從裕滄州清池令皇考諱察躬湖州德清令世德廉孝揚於河滸士之稱家風者歸焉既嗚呼宗元不謹先君之教以陷大禍幸而緩于死不克成先君之寵贈又無以寧太夫人之飲食天殛薦酷名在刑書不得手開玄堂以奉安祔罪惡益大世無所容尚顧嗣續不敢即死支綴氣息以嚴邦刑大懼祭祀之無主以忝盛德敢用特牲昭告神道號呌萬里以畢其辭云臨海弋公阡表公諱潤字天澤姓弋氏系出臨海占籍汝州之梁縣者不知其幾昭穆矣大父整生二子長曰洪次曰海洪娶張氏二子曰祐曰福海娶酒氏公其所生子也弋氏自先世不異財公早孤能自樹立如成人事從兄祐殊恭遜祐嘗以事客內鄉者二十年比還公殖産倍於舊祐歸求分居公謂祐言家所有皆父兄所積潤但謹守僅無損耗耳兄幸歸請悉主之潤得供指使足矣祐悔悟曰吾弟忠敬如此我乃為讒口所間慚恨無所及尚欲言分異耶乃更相友愛壬辰河南破公挈家避于西山山柵破公家亦被驅逐一卒見公稠人中請于主帥云此吾鄉善士其縱遣之帥遣公舉家去是夜所俘悉坑之里社為空公家獨全親舊嘆曰為善之報見之今日矣明年春鄉郡遊騎遍滿公自度不能受辱乃自投水中得年若干實某年月日也元遺山墳記式韋夫人墳記韋夫人終成都殯萬年遷柩渭南祔而不合大葬未利以俟禮也其族系如某人之志堋用元和十四年月日子某為石刻而納諸壙桞子厚誄式衡州刺史東平吕君誄維唐元和六年八月日衡州刺史東平吕君卒爰用十月二十四日藁葬于江陵之野嗚呼君有智勇孝仁惟其能可用康天下惟其志可用經百世不克而死世亦無由知焉君由道州以陟為衡州君之卒二州之人哭者逾月湖南人重社飲酒是月上戊不酒去樂會哭于神所而歸余居永州在二州中間其哀聲交於北南舟船之下上必呱呱然蓋嘗聞于古而觀于今也逸君所居官為第三品宜得諡于太常余懼州吏之其辭也私為之誄以志其行其辭曰麟死魯郊其靈不施濯濯夫子故潔其儀冠仁服義干櫓書詩忠貞繼佩智勇承綦跨騰商周堯舜是師道不勝禍天固豫欺鬼神不怒妖孽咸疑何付之德而奪其時嗚呼哀哉命姓惟吕勤唐以力輔寧萬邦受胙爾國惟師元聖周以降德世征五侯伊祖之則嗣濟厥武前書是式至於化光爰耀其特春秋之元儒者咸惑君達其道車焉孔直聖人有心由我而得敷施變化動無不克推理惟公舒文以翼宣于事業與古同極道不茍用資仕乃揚進于禮司奮藻含章決科聨中休問用張署讐百氏錯綜逾光超都諫列屢皂其囊帝殊爾能人服其智戎悔厥禍欵邉求侍盛選邦良難乎始使君登御史贊命承事風動海壖皇威以致來總征賦甲兹郎吏制用經邦時推重器諸臣之復周官匪易漢課箋奏鮮云能備君自他曹載出其技筆削自任羣儒革議正郎司刑邦憲為二糾佞肅邪諂諛具畏遷理於道民服沐嘉恩踈若昵惕邇如遐實閉其閣而撫千家載其愈樂申以舞歌賦無吏迫威不刑加浩然順風從令無譁繇蠶外邑我繭盈車雜耕鄰邦我黍之華既字其畜亦藝其麻鼛鼓斯屏人喜其多始富中教興良廢邪考績既成王用興嗟陟于嶽濵言進其律號呼南竭謳謡北溢欺吏悍民先聲如失逋租匿役歸誠自出兼并既息罷羸乃逸惟昔舉善盜奔于鄰今我興仁化為齊人惟昔富人或賑之粟今我厚生不竭而足邦思其弼人戴惟父善胡召災仁胡罹咎俾民伊怙而君不壽矯矯貪凌乃康乃茂嗚呼哀哉廪不餘食藏無積帛內厚族姻外賙賔客恆是懸罄逮兹易簀僮無凶服葬非舊陌嗚呼哀哉君昔與余講德討儒時中之奧希聖為徒志存致君笑詠唐虞揭兹日月以耀羣愚疑生所怪怒起特殊齒舌嗷嗷雷動風驅良辰不偶卒與禍俱直道莫試嘉言罔敷佐王之器窮以郡符秩在三品宜諡王都諸生羣吏尚擁長圖故友咨懷纍行陳謨是旌是告永永不渝嗚呼哀哉桞子厚虞鳴鶴誄維某年月日前進士虞九臯字鳴鶴終于長安親仁里既克葬于髙陽原二三友生皆至于墓哀其行之不昭于世追列遺懿求諸后土申薦嘉名實曰恭甫乃作誄曰吳虞之分爰宅上陽其後優遊在越為鄉延詡輔漢恢定封疆東徙之賢時惟仲翔曰預曰喜在晉克彰義篤斯文有苾其方祕書多能垂耀于唐洎于漢陽世德以昌毗贊尚父休徽用揚惟我先君並時翺翔洽主記室蔚其輝光實契伯仲永永不忘漢陽元子實紹其美傳襲儒風彪炳文史克恭以孝惟禮是履譽洽於鄉論為秀士百郡之選叢於京師昧沒騰籍乘凌蔽欺生之始至則奮其儀退默以謙人悅而隨名卿是挈先進咸推方出羣類振耀于時禍丁舅氏漂淪海沂捧訃號呼匍匐增悲喪有幼主禮或多違孰徇于名而不是思投袂就道乘艱若夷竭誠喪具申敬裳帷萬里來復祗祔于墓遽不凌節儉而有度由其溫恭守以貞固行道咨嗟觀禮興慕復從鄉賦煥發其華克不再舉聞于邦家倚閭千里歡咏斯多姻族盈門載笑且歌君之不淑名立志沮慶歸其鄉身終逆旅生死已間壽觴方舉賀書在途委骨歸土哀歡易地弔慶交戶神胡不仁降此大苦嗚呼哀哉惟昔夏首羈貫相親通家修好講道為鄰既冠于阼思致其身升于司徒及爾繼年交歡二紀莫間斯言愈乎其和確爾其堅更為砥礪咸去韋絃今則遽已吾其缺然嗚呼哀哉誄行謀諡惟古之道生而無位殁有其號惟是友生徘徊顧悼爰用一惠幽明是告溫溫其恭惟德之經先民有作今也是旌嗚呼恭甫欽此嘉名行狀式惟韓退之董公行狀如式開書餘並疏始末于其下文體之異隨事詳酌焉故金紫光祿大夫檢校尚書左僕射同中書門下平章事兼汴州刺史充宣武軍節度副大使知節度事管內度支營田汴宋亳潁等州觀察處置等使上柱國隴西郡開國公贈太傅董公行狀曾祖仁琬皇任梁州博士祖大禮皇贈右散騎常侍父伯良皇贈尚書左僕射公諱晉字混成河中虞鄉萬嵗里人階纍升為金紫光祿大夫勳纍升為上柱國爵纍升為隴西郡開國公娶南陽張氏夫人後娶京兆韋氏夫人皆先公終四子全道溪全素澥全道全素皆上所賜名全道為祕書省著作郎溪為祕書省祕書郎全素為大理評事澥為太常寺太祝皆善士有學行謹具厯官行事狀伏請牒考功并牒太常議所諡牒史館請垂編録謹狀貞元十五年五月十八日故吏前汴宋亳潁等州觀察推官將仕郎試祕書省校書郎韓愈狀唐故贈絳州刺史馬府君行狀君諱某字某其先為嬴姓當周之衰處晉為趙氏晉亡而趙氏為諸侯其後益大與齊楚韓魏燕為六國俱稱王其别子趙奢當趙時破秦軍閼與有功號馬服君子孫由是以馬為氏日拜太僕少卿疾病一年貞元十八年七月二十五終于家凡年四十有五其弟少府監暢上印綬求追贈贈絳州刺史布帛百匹夫人滎陽鄭氏王屋縣令况之女有賢行侍君疾逾年不下堂食菜飲水藥物必自擇將進輒先嘗方書本草恆置左右子男二人赦前左衛倉曹參軍揚右清道率府胄曹參軍女子二人在室雖皆幼侍疾居喪如成人愈既世通家詳聞其世系事業今葬有期日從少府請掇其大者為行狀託立言之君子而圖其不朽焉故銀青光祿大夫右散騎常侍輕車都尉宜城縣開國伯桞公行狀如韓退之式但多開州縣鄉里姓名并年耳縣曾祖善才皇荆王侍讀祖尚素皇潤州曲阿令汝父慶休皇渤海郡縣丞贈蔡州刺史工部尚書字州梁縣梁城鄉思義里桞渾年七十四狀公惟湥其先河東人靜夫其子恭父慈善行也拊循制理能政也直廉潔儉德也拒疑獨斷明識也冒危以捍牧圉大節也犯顔以陳訏謨至忠也有一于此尚宜旌褒矧兹備體焉可以已固當飾以榮號章示後來而故吏遺孤淪寓遐壤久稽彛典罪在宗屬敢用評隲舊行敷贊遺風若乃揚孔氏褒貶之文舉周公懲勸之法徴于誄諡則有司存謹狀故祕書少監陳公行狀五代祖某陳宜都王軍曾祖某皇會稽郡司馬學祖某皇晉陵郡司功參父某皇右補闕翰林士贈祕書少監某州某縣某鄉某里陳京年若干狀冠公姓陳氏自潁川來𨽻京兆萬年胄貴里諱京既字曰慶復舉進士為太子正字咸陽尉太常博士左補闕尚書膳部考功員外郎司封郎中給事中祕書少監自考功以來凡四命為集賢學士德宗登遐公病痼輿曵就位備哀敬之節由是滋甚遂以所居官致仕貞元二十一年四月二十五日終于安邑里昭夫其忠烈之褒也相府之有誡也太廟之東向也陵之不更其故也官守之不可奪也立言之不可誣也利之不茍就也害之不茍去也其忠類朱雲其孝類頴考叔其廉類公儀休而又文以文之學以輔之而天子以為之知既得其道又得其時而不為公卿者病也故議者咸惜其始而哀其終焉公之喪凡五十四日而夫人又殁毁也夫人之父曰偕司農卿祖曰某贈太子太保某故集賢吏也得公之遺事于其家書而授公之友以志公之墓謹狀永貞元年八月五日尚書禮部員外郎桞宗元狀韓昌黎先生行狀李翺附前式大抵相類故止見其目當意推之後倣此吏部侍郎沈公行狀杜牧之御史大夫清河公崔公行狀國子祭酒韓洄行狀權載之宣州觀察使王凝行狀司空表聖尚書戶部侍郎蔡公行狀歐陽永叔司封員外郎許公行狀歐陽文忠公行狀吳充司馬溫公行狀蘇子瞻論行狀語録朱子語録云韓文千變萬化無心變歐陽有心變杜祁公墓志一件未了又説一件韓董晉行狀尚稍長權德輿作宰相神道碑只一板許歐蘇便長了名號稱呼類大行李善文選注周書曰諡者行之迹是以大行受大名細行受細名風俗通曰皇帝新崩未有定諡故總其名曰大行皇帝禮記曰天子死曰崩諸侯曰薨大夫曰卒士曰不祿庶人曰死注異死名者為人褻其無知若猶不同然也自上顛壞曰崩薨顛壞之聲卒終也不祿不終其祿死之言澌也精神澌盡也禮記曰天王崩告喪曰天王登假措之廟立之主曰帝假音遐云莊子其死登假三年而形遁上辨證楚辭逺遊載營魄而登霞兮掩浮雲而征朱氏注曰霞與遐同猶曰適逺云爾曲禮告喪之辭乃又借以為死之美稱莊子作登假蓋亦此例但此篇注者遂解為赤黃之氣釋莊音又讀假為格而訓至焉則其誤愈逺矣禮記曰壽考曰卒短折曰不祿注祿謂有德行任為大夫士而不為者老而死從大夫之稱少而死從士之稱王父曰皇祖考王母曰皇祖妣父曰皇考母曰皇妣夫曰皇辟生曰父曰母曰妻死曰考曰妣曰嬪韓魏公祭式元遺山記其大略姑録之古人書曾祖皇祖皇考魏公易皇以顯字顯曾祖顯曾祖妣顯祖顯祖妣顯考顯妣妻先亡曰顯嬪妻祭夫曰顯辟穆甫兄弟曰顯穆甫諸三品官以上職事官身故者若係親賢勳舊皆有司録奏取旨贈官官職未至而特旨追贈者不拘此限諸諡職事以上三品散官二品以上從吏部勘當善惡仍下所屬追取行狀關移禮部呈省聞奏若有旨議諡即下太常寺擬諡訖申省議定奏聞如有司不以時降行亦許本家陳請其官職未至而德行超異者特旨議之人亦準此古金石例云南京赤倉髙太皇祖塋作昭穆葬小兒子死共葬一處謂之學堂小女共葬一處謂之繡堂别有乳母墳師友墳師友墳以葬門客等時忌字樣類古金石例云不敢稱皇字與隧字書碑額例真字八分書謂之題額篆字則云篆額今略舉一二式附于後并撰書建立附夫子廟堂記駕部郎中程浩撰朝議郎判尚書武部員外郎琅琊顔真卿書朝散大夫檢校尚書都官郎中東海徐浩篆額唐天寶十一載嵗次壬辰四月乙丑朔二十二日丙戌建在記後重修蜀先主廟碑儒林郎前鄭州防禦判官提舉學校常平倉事武騎尉賜緋魚袋王庭筠撰書篆桞州羅池廟碑尚書吏部侍郎賜紫金魚袋韓愈撰中書舍人史館修撰賜紫金魚袋沈傳師書朝議郎桂管觀察大使試太常寺協律郎上柱國陳曽篆額此與建立俱在碑後長慶二年正月十一日桂管都防禦先鋒兵馬使朝散大夫試左衛長史孫季雄建立書碑陽例蘇子瞻韓文公廟碑小字本後云軾再啓題于後書碑陰例後周尉遲逈碑在相下刻云蔡有鄰書并陰又寶刻叢編云漢劉熊碑亦有碑隂僧碑論僧碑宜書不宜書桞子厚大明和尚碑隂凡葬大浮圖無竁穴其用于碑不宜然昔之公室禮得用碑以葬其後子孫因宜不去遂銘德行用圖久于世及秦刻山石號其功德亦謂之碑而其用遂行然則雖浮圖亦宜也凡葬大浮圖其徒廣則能為碑晉宋尚法故為碑者多法梁尚禪故碑多禪法不周施禪不大行而律存焉故近世碑多律凡葬大浮圖未嘗有比丘尼主碑事今惟無染實來涕泪以求其志益堅又能言其師他德尤備故書之碑隂宋景文筆記論僧碑不宜書論碑文合書不合書歐陽永叔陳文惠公神道碑公諱堯佐前娶曰杞國夫人宋氏後娶曰沂國夫人王氏子男十人長曰述古章秦公二子長曰堯叟為樞密使同中書門下平事季曰堯咨為武信軍節度使皆舉進士第一人及第三子已貴秦公尚無恙每賔客至其家公及伯季侍立左右坐客蹙蹜不安求去秦公笑曰此兒子輩耳故天下皆以秦公教子為法而以陳氏世家為榮公之孫四十人曽孫二人合伯季之後若子若孫若曽孫六十有八人女若孫曽五十有四人而仕于朝者多以材稱于時嗚呼可謂盛矣之其文如此皆所宜書者故備列云齊人曹元野云濟南李昌道作李千戶先塋碑其間不書李千戶之妻某氏只寫子幾人其妻怒元野添上説知昌道公言不可書為婦人未終如何敢書婦人此是前輩所傳如此書銘陰例唐相國房公德銘之陰房琯也稱天子之三公稱公王者之後公諸侯之入為王卿士亦曰公有土封其臣稱之曰公尊其道而師之稱曰公楚之僣凡為縣者皆曰公古之人通謂年之長者曰公宗唐之大臣以姓配公最著者曰房公房公相玄有勞于蜀人咸服其節相肅宗作訓于岐人咸尊其道惟正直慈愛以成于德用是進退所居而事理辨所去而人哀號理袁人袁人不勝其懷為文士趙郡李華銘公之德亂故不克立今刺史太原王涯嘉公之道猶在乎人人不忘公之道為之刻石我王公嘗以機密匡天子于禁中遵公之道刺于邦承公之理又能尊公之德起遺文以昭前烈則其入為卿士三公也孰曰不宜吾懼其去我也遽願書于銘之陰用永表于邦之良政桞子厚金石例卷五
